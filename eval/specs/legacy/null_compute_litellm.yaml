name: null_compute_litellm
matrix:
  name_template: "{num_nodes}_nodes"
  axes:
    - name: num_nodes
      values: [1, 2, 4, 8, 16, 32, 64]
      targets:
        - deployment.num_nodes
        - client.num_nodes
        - scheduler.nodes
      label_template: "{value}_nodes"
trace:
  kind: weak_scaling
workload:
  duration: 5.0
  input_len: 2048
  output_len: 512
  rate_per_node: 80.0
deployment:
  models:
    - model_id: meta-llama/Meta-Llama-3-8B-Instruct
      tensor_parallel_size: 1
      pipeline_parallel_size: 1
      max_model_len: 4096
      size: 8
  replica_max_ongoing_requests: 64
client:
  num_runs: 3
  dest: proxy
  num_go_procs: 16
  num_go_workers: 2
  go_concurrency: 40
backend:
  default: ray
  args:
    ray:
      launch:
        null_compute: true
      proxy:
        type: litellm
        num_workers: 1
scheduler:
  type: pbs
