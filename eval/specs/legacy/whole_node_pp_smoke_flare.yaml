name: whole_node_pp_smoke_flare
matrix:
  name_template: "{num_nodes}_nodes"
  axes:
    - name: num_nodes
      values: [2]
      targets: [deployment.num_nodes, client.num_nodes, scheduler.nodes]
      label_template: "{value}_nodes"
trace:
  kind: weak_scaling
workload:
  duration: 30.0
  input_len: 512
  output_len: 128
  rate_per_node: 0.25
deployment:
  model_storage_path: /flare/datasets/model-weights/hub
  models:
    - model_id: meta-llama/Llama-2-7b-chat-hf
      tensor_parallel_size: 8
      pipeline_parallel_size: 2
      max_model_len: 4096
      size: 8
  replica_max_ongoing_requests: 64
client:
  num_runs: 1
  dest: proxy
  num_go_procs: 16
  num_go_workers: 2
  go_concurrency: 8
backend:
  default: ray
  args:
    ray:
      proxy:
        type: litellm
        num_workers: 1
scheduler:
  type: pbs
