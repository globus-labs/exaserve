name: burst_trace
matrix:
  name_template: "{num_nodes}_nodes"
  axes:
    - name: num_nodes
      values: [1]
      targets: [deployment.num_nodes, client.num_nodes, scheduler.nodes]
trace:
  kind: azure_trace
workload:
  duration: 30.0
  input_len: 2048
  output_len: 128
  speedup: 10.0
  sampling_strategy: peak
deployment:
  models:
    - model_id: meta-llama/Meta-Llama-3-8B-Instruct
      tensor_parallel_size: 1
      pipeline_parallel_size: 1
      max_model_len: 4096
      size: 8
      num_replicas: 4
client:
  num_runs: 1
  dest: direct
  direct_dispatch: mesh  # four routed replicas share one client node
backend:
  default: ray
  args:
    ray:
      proxy:
        type: none
scheduler:
  type: pbs
