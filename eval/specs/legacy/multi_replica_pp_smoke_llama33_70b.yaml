name: multi_replica_pp_smoke_llama33_70b
matrix:
  name_template: "{num_nodes}_nodes"
  axes:
    - name: num_nodes
      values: [4]
      targets: [deployment.num_nodes, client.num_nodes, scheduler.nodes]
      label_template: "{value}_nodes"
trace:
  kind: weak_scaling
workload:
  duration: 30.0
  input_len: 512
  output_len: 128
  rate_per_node: 4.0
deployment:
  model_storage_path: /flare/datasets/model-weights/hub
  models:
    - model_id: meta-llama/Llama-3.3-70B-Instruct
      tensor_parallel_size: 8
      pipeline_parallel_size: 2
      max_model_len: 4096
      size: 70
      num_replicas: 2
  replica_max_ongoing_requests: 64
client:
  num_runs: 1
  dest: direct
  direct_dispatch: mesh  # PP exposes replica routes, not one local target per node
  num_go_procs: 16
  num_go_workers: 2
  go_concurrency: 40
backend:
  default: ray
  args:
    ray:
      proxy:
        type: none
scheduler:
  type: pbs
