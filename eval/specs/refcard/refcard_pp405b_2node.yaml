name: refcard_pp405b_2node
# Reference-card multi-node PP demo: Llama-3.1-405B-Instruct (bf16, 756 GB)
# genuinely requires >1 node: legal TP is {1,2,4,8} (128 heads) and a TP=8
# stage has ~420 GiB usable -> 756 GB needs PP>=2. Config: TP=8 x PP=2 = one
# replica spanning 2 whole nodes (8/12 tiles each).
#
# STAGING: the allocation head reads the shared model and streams the two PP
# stage views through the allocation-wide MPI distributor. Each node receives
# only its ~380 GiB stage under node-local tmpfs; no engine reads Lustre.
#
# EDIT model_storage_path to your own shared source model directory. Keep
# local_stage_path on node-local storage.
matrix:
  name_template: '{num_nodes}_nodes'
  axes:
  - name: num_nodes
    values: [2]
    targets: [deployment.num_nodes, scheduler.nodes]
    label_template: '{value}_nodes'
  derived:
  - path: client.num_nodes
    expr: '2'
trace:
  kind: weak_scaling
workload:
  duration: 30.0
  input_len: 128
  output_len: 32
  rate_per_node: 0.5
  generation_mode: deterministic
deployment:
  validation_mode: true
  model_storage_path: /lus/flare/projects/<PROJECT>/<user>/models
  local_stage_path: /tmp/pp405b_shard
  models:
  - model_id: meta-llama/Llama-3.1-405B-Instruct
    tensor_parallel_size: 8
    pipeline_parallel_size: 2
    num_replicas: 1
    max_model_len: 4096
    size: 405
    gpu_memory_utilization: 0.90
    enforce_eager: true
    max_num_seqs: 8
  replica_max_ongoing_requests: 16
client:
  num_runs: 1
  num_nodes: 2
  dest: proxy
  stream: true
  num_go_procs: 1
  num_go_workers: 4
  go_concurrency: 16
backend:
  default: ray
  args:
    ray:
      launch:
        ray_node_cpus: 64
      proxy:
        type: haproxy
        port: 4001
        backend_port: 8000
        num_workers: 1
        options:
          balance: leastconn
          maxconn: 8000
scheduler:
  type: pbs
  queue: capacity
  walltime: 01:00:00
