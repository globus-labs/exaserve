name: sglang_haproxy_full
# SGLang backend, HAProxy weak-scaling 1..256 — mirrors proxycmp_haproxy (the vLLM
# baseline) but with deployment.engine: sglang (drop-in). Identical Ray Serve +
# HAProxy + Go replay client; only the per-replica engine differs.
# Paper protocol (aligned with sc26workshop/full + oat_8b_baseline OAT convention):
# same model / gpu_mem / max_num_seqs / max_ongoing as the vLLM baseline, and
# rate_per_node = 0.9 x measured single-node saturation. sglang_sat_v1 run2
# measured S ~= 17 rps/node (Meta-Llama-3-8B-Instruct, torch_native, seqs 32 vs
# 64 within 3% -> knobs held at vLLM parity), so rate = 15 (vLLM: 109 -> 98).
matrix:
  name_template: 'n{num_nodes}'
  axes:
  - name: num_nodes
    values: [1, 4, 16, 64, 128, 256]
    targets: [deployment.num_nodes, scheduler.nodes]
    label_template: '{value}_nodes'
  derived:
  - path: client.num_nodes
    expr: 'min(num_nodes, 4)'
  - path: scheduler.queue
    expr: '"capacity" if num_nodes <= 16 else ("prod" if num_nodes >= 256 else "debug-scaling")'
  - path: scheduler.walltime
    expr: '"02:00:00" if num_nodes <= 16 else ("02:30:00" if num_nodes >= 256 else "01:00:00")'
trace:
  kind: weak_scaling
workload:
  duration: 60.0
  input_len: 64
  output_len: 64
  rate_per_node: 15.0
  arrival: fixed
  generation_mode: deterministic
deployment:
  engine: sglang
  # model_storage_path omitted: Meta-Llama-3-8B-Instruct lives in the
  # site-default storage (AuroraGPT/wenyiw/models), like the paper specs.
  models:
  - model_id: meta-llama/Meta-Llama-3-8B-Instruct
    tensor_parallel_size: 1
    pipeline_parallel_size: 1
    max_model_len: 4096
    size: 8
    gpu_memory_utilization: 0.90
    enforce_eager: true
    max_num_seqs: 64
  replica_max_ongoing_requests: 256
  collect_stats: false
client:
  num_runs: 6
  dest: proxy
  stream: true
  num_go_procs: 4
  num_go_workers: 4
backend:
  default: ray
  args:
    ray:
      launch:
        ray_node_cpus: 64
        clean_stage: true
      proxy:
        type: haproxy
        port: 4001
        backend_port: 8000
        num_workers: 1
        options:
          balance: leastconn
          maxconn: 100000
scheduler:
  type: pbs
