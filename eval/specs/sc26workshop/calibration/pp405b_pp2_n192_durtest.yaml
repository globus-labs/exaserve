name: pp405b_pp2_n192_durtest
# DIAGNOSTIC for the weak-scaling "efficiency drop" (128n 81% -> 256n 67%).
# Data shows the drop is NOT the proxy (present in direct mode) and NOT a real
# throughput limit (steady-state eff ~97% at every scale). It's a short-benchmark
# artifact: overall rps = requests / wall-clock over a fixed 120s injection, and
# the straggler tail-drain grows with replica count (worst-case latency 44->94s
# from n64->n256). Per-replica load ~6.8 in-flight vs max_num_seqs=8 -> little
# headroom -> with more replicas the odds of a transiently-overloaded replica
# (and a slow straggler) rise. Classic tail-at-scale.
#
# TEST: fix scale at 192 nodes (96 replicas) and vary ONLY the run duration.
#   - dur120 = the sweep's window (baseline; also the intermediate scale point)
#   - dur300 = longer window; if the drop is a ramp+tail artifact, the fixed
#     overhead amortizes and overall efficiency should rise toward steady-state
#     (~97%), while steady-state itself stays flat. That confirms the mechanism.
# Direct mode (no proxy) to match the sweep the numbers came from.
matrix:
  name_template: 'dur{duration}'
  axes:
  - name: duration
    values: [120, 300]
    targets: [workload.duration]
    label_template: 'dur{value}'
trace:
  kind: weak_scaling
workload:
  duration: 120.0            # overridden per matrix point
  input_len: 64
  output_len: 64
  rate_per_node: 0.2         # 0.4 rps/replica, identical to the sweep
  arrival: fixed
  generation_mode: deterministic
deployment:
  num_nodes: 192             # 96 replicas (PP=2), the intermediate scale point
  model_storage_path: /lus/flare/projects/AuroraGPT/wenyiw/models
  local_stage_path: /tmp/pp405b_shard
  models:
  - model_id: meta-llama/Llama-3.1-405B-Instruct
    tensor_parallel_size: 8
    pipeline_parallel_size: 2
    num_replicas: 96
    max_model_len: 4096
    size: 405
    gpu_memory_utilization: 0.90
    enforce_eager: true
    max_num_seqs: 8
  replica_max_ongoing_requests: 16
client:
  num_runs: 2                # run0 warmup (discard) + run1 measured, as in the sweep
  dest: direct
  stream: true
  num_go_procs: 8
  num_go_workers: 4
  go_concurrency: 256
backend:
  default: ray
  args:
    ray:
      launch:
        ray_node_cpus: 64
      proxy:
        type: none
        backend_port: 8000
scheduler:
  type: pbs
  nodes: 192
  queue: debug-scaling
  walltime: '01:00:00'
