name: sat_120b_64x64
# Set 2 saturation finder - GPT-OSS-120B (TP=8, 1 replica/node, 4 tiles idle),
# baseline 64/64 shape, 1 node. Sets the rate for the 120B OAT row.
# Model from the shared hub (122 GB MXFP4) -> bcast to tmpfs is fine.
matrix:
  name_template: baseline
  axes:
  - name: num_nodes
    values: [1]
    targets: [deployment.num_nodes, scheduler.nodes]
    label_template: '{value}n'
  derived:
  - path: client.num_nodes
    expr: '1'
trace:
  kind: weak_scaling
workload:
  duration: 5.0
  input_len: 64
  output_len: 64
  rate_per_node: 1000.0
deployment:
  validation_mode: true
  num_nodes: 1
  model_storage_path: /lus/flare/projects/datasets/model-weights/hub
  models:
  - model_id: openai/gpt-oss-120b
    tensor_parallel_size: 8
    pipeline_parallel_size: 1
    max_model_len: 4096
    size: 120
    gpu_memory_utilization: 0.90
    enforce_eager: true
    max_num_seqs: 64
  replica_max_ongoing_requests: 128
client:
  dest: proxy
  num_go_procs: 1
  num_go_workers: 4
  saturation:
    enabled: true
    initial_rate: 10
    search_mode: binary
    step_duration_s: 15
    stream: true
    tolerance: 0.05
    warmup_duration_s: 5
    plateau_ratio: 0.75
backend:
  default: ray
  args:
    ray:
      launch:
        ray_node_cpus: 64
      proxy:
        type: haproxy
        port: 4001
        backend_port: 8000
        num_workers: 1
        options:
          balance: leastconn
          maxconn: 8000
scheduler:
  type: pbs
  queue: capacity
  walltime: 01:00:00
