name: sat_120b_paper_recal
# Re-calibrate the 120B OAT rate against the PAPER SLO (TTFT<=1s, p99 TBT<=250ms).
# The throughput-knee finder (sat_120b_64x64 -> 19, OAT 17.1) overshot: a
# SUSTAINED 60s run at 17.1 gave p99 TBT 568ms and TTFT 3.9s (attainment 0.139).
# 120B is TBT-bound well before throughput saturates. Sweep fixed sustained
# rates at N=1; pick the highest cell with paper attainment >= ~0.95.
# clean_stage off so cells 2+ reuse the staged 120B weights (faster sweep).
matrix:
  name_template: 'r{rate}'
  axes:
  - name: rate
    values: [9, 12, 15]
    targets: [workload.rate_per_node]
    label_template: 'r{value}'
  derived:
  - path: client.num_nodes
    expr: '1'
trace:
  kind: weak_scaling
workload:
  duration: 60.0
  input_len: 64
  output_len: 64
  rate_per_node: 9
  arrival: fixed
  generation_mode: deterministic
deployment:
  validation_mode: true
  num_nodes: 1
  model_storage_path: /flare/datasets/model-weights/hub
  models:
  - model_id: openai/gpt-oss-120b
    tensor_parallel_size: 8
    pipeline_parallel_size: 1
    max_model_len: 4096
    size: 120
    gpu_memory_utilization: 0.90
    enforce_eager: true
    max_num_seqs: 64
  replica_max_ongoing_requests: 128
  collect_stats: true
client:
  num_runs: 2
  num_nodes: 1
  dest: proxy
  stream: true
  num_go_procs: 4
  num_go_workers: 4
backend:
  default: ray
  args:
    ray:
      launch:
        ray_node_cpus: 64
      proxy:
        type: haproxy
        port: 4001
        backend_port: 8000
        num_workers: 1
        options:
          balance: leastconn
          maxconn: 8000
scheduler:
  type: pbs
  queue: capacity
  walltime: 01:00:00
  nodes: 1
