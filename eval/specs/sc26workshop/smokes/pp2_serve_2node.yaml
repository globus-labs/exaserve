name: pp2_serve_2node
# Confirm multiple PP=2 replicas actually SERVE at a sane density. The auto
# (unset num_replicas) run packed 12 replicas (24 workers) onto 2 nodes and hit
# pthread_create EAGAIN (thread exhaustion) — not a PP bug, just over-dense
# small-TP packing. Here num_replicas=2 -> 4 PP workers -> should serve cleanly.
# Reuses the already-staged cache at /tmp/hf_home_pp2verify.
matrix:
  name_template: '{num_nodes}_nodes'
  axes:
  - name: num_nodes
    values:
    - 2
    targets:
    - deployment.num_nodes
    - scheduler.nodes
    label_template: '{value}_nodes'
  derived:
  - path: client.num_nodes
    expr: '2'
trace:
  kind: weak_scaling
workload:
  duration: 30.0
  input_len: 128
  output_len: 64
  rate_per_node: 5.0
  generation_mode: deterministic
deployment:
  local_stage_path: /tmp/hf_home_pp2verify
  models:
  - model_id: meta-llama/Meta-Llama-3-8B-Instruct
    tensor_parallel_size: 1
    pipeline_parallel_size: 2
    num_replicas: 2
    max_model_len: 4096
    size: 8
    gpu_memory_utilization: 0.9
    enforce_eager: true
    max_num_seqs: 64
  replica_max_ongoing_requests: 128
client:
  num_runs: 1
  num_nodes: 2
  dest: proxy
  stream: true
  num_go_procs: 2
  num_go_workers: 4
  go_concurrency: 200
backend:
  default: ray
  args:
    ray:
      launch:
        ray_node_cpus: 64
      proxy:
        type: haproxy
        port: 4001
        backend_port: 8000
        num_workers: 1
        options:
          balance: leastconn
          maxconn: 100000
scheduler:
  type: pbs
  queue: debug
  walltime: 01:00:00
