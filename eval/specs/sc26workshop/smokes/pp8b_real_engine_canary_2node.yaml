name: pp8b_real_engine_canary_2node
# Cheap real-engine isolation for the complete PP startup path. Unlike the
# inert compatibility canary, this run stages an actual model and constructs
# vLLM EngineCore plus all 16 TP8 x PP2 Ray workers. startup_only stops after
# the canonical readiness canary and publishes the normal receipt, shutdown,
# and terminal evidence without paying for a replay workload.
matrix:
  name_template: 'n{num_nodes}'
  axes:
  - name: num_nodes
    values: [2]
    targets: [deployment.num_nodes, scheduler.nodes]
trace:
  kind: weak_scaling
workload:
  duration: 1.0
  input_len: 64
  output_len: 1
  # startup_only never replays this trace, but immutable materialization still
  # requires a nonempty deterministic artifact. This produces two requests.
  rate_per_node: 1.0
  arrival: fixed
  generation_mode: deterministic
deployment:
  validation_mode: true
  num_nodes: 2
  num_gpus_per_node: 12
  model_storage_path: /lus/flare/projects/AuroraGPT/wenyiw/models
  local_stage_path: /tmp/pp8b_canary_shard
  control:
    watchdog_cleanup_deadline_s: 600.0
  readiness:
    initial_deadline_s: 3000.0
    recovery_deadline_s: 600.0
    canary_timeout_s: 300.0
  models:
  - model_id: meta-llama/Meta-Llama-3-8B-Instruct
    tensor_parallel_size: 8
    pipeline_parallel_size: 2
    num_replicas: 1
    max_model_len: 4096
    size: 8
    gpu_memory_utilization: 0.90
    enforce_eager: true
    max_num_seqs: 1
  replica_max_ongoing_requests: 1
client:
  num_runs: 1
  startup_only: true
  dest: proxy
  stream: false
  num_nodes: 1
  num_go_procs: 1
  num_go_workers: 1
  go_concurrency: 1
backend:
  default: ray
  args:
    ray:
      launch:
        ray_node_cpus: 64
        clean_stage: true
        null_compute: false
        instrumentation: true
      proxy:
        type: haproxy
        port: 4001
        backend_port: 8000
        num_workers: 1
        options:
          balance: leastconn
          maxconn: 64
scheduler:
  type: pbs
  queue: debug
  walltime: 01:00:00
