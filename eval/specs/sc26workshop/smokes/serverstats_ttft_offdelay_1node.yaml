name: serverstats_ttft_offdelay_1node
# Task 1 validation + Task 2 "on" arm. 1 node, low rate (20 << ~109 knee) so
# TTFT/TBT reflect proxy coalescing, not queueing. http-no-delay OFF (coalescing on) - the "off" arm.
# stream + collect_stats => exercises the fixed server-side collector AND gives
# the baseline for the on-vs-off TTFT comparison.
matrix:
  name_template: 'n{num_nodes}'
  axes:
  - name: num_nodes
    values: [1]
    targets: [deployment.num_nodes, scheduler.nodes]
    label_template: '{value}_nodes'
  derived:
  - path: client.num_nodes
    expr: '1'
  - path: scheduler.queue
    expr: '"debug"'
  - path: scheduler.walltime
    expr: '"00:30:00"'
trace:
  kind: weak_scaling
workload:
  duration: 60.0
  input_len: 64
  output_len: 64
  rate_per_node: 20.0
  arrival: fixed
  generation_mode: deterministic
deployment:
  models:
  - model_id: meta-llama/Meta-Llama-3-8B-Instruct
    tensor_parallel_size: 1
    pipeline_parallel_size: 1
    max_model_len: 4096
    size: 8
    gpu_memory_utilization: 0.90
    enforce_eager: true
    max_num_seqs: 64
  replica_max_ongoing_requests: 256
  collect_stats: true
client:
  num_runs: 2
  dest: proxy
  stream: true
  num_go_procs: 1
  num_go_workers: 4
backend:
  default: ray
  args:
    ray:
      launch:
        ray_node_cpus: 64
        clean_stage: true
      proxy:
        type: haproxy
        port: 4001
        backend_port: 8000
        num_workers: 1
        options:
          balance: leastconn
          maxconn: 100000
          http_no_delay: false
scheduler:
  type: pbs
