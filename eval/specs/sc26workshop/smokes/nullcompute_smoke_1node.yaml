name: nullcompute_smoke_1node
# VALIDATION stand-in for EXP SET 3 (real spec nullcompute_scaling is 256+ nodes).
# 1 node, null-compute (no forward pass) + instrumentation probes + startup_only.
# Confirms the mode works before the capacity campaign:
#   - null-compute and instrumentation are bound into DeploymentPlan.runtime
#   - canonical generation-bound DeploymentStatus reaches READY without loading the model
#   - scaling_trace.json + /tmp/exaserve_inst/* instrumentation files written
#   - startup_only exits at READY (no replay)
matrix:
  name_template: '{num_nodes}_nodes'
  axes:
  - name: num_nodes
    values: [1]
    targets: [deployment.num_nodes, scheduler.nodes]
    label_template: '{value}_nodes'
  derived:
  - path: client.num_nodes
    expr: '1'
trace:
  kind: weak_scaling
workload:
  duration: 1.0
  input_len: 64
  output_len: 64
  rate_per_node: 1.0
deployment:
  models:
  - model_id: meta-llama/Meta-Llama-3-8B-Instruct
    tensor_parallel_size: 1
    pipeline_parallel_size: 1
    max_model_len: 4096
    size: 8
    num_cpus_per_replica: 1
    gpu_memory_utilization: 0.90
    enforce_eager: true
    max_num_seqs: 64
  replica_max_ongoing_requests: 256
client:
  num_runs: 1
  num_nodes: 1
  startup_only: true
  dest: proxy
  stream: false
  num_go_procs: 1
  num_go_workers: 4
backend:
  default: ray
  args:
    ray:
      launch:
        ray_node_cpus: 64
        null_compute: true
        instrumentation: true
      proxy:
        type: haproxy
        port: 4001
        backend_port: 8000
        num_workers: 1
        options:
          balance: leastconn
          maxconn: 8000
scheduler:
  type: pbs
  queue: capacity
  walltime: 01:00:00
