name: clean_stage_check_1node
# Validation for the per-run clean-stage flag: 1 node, startup_only (no replay),
# clean_stage=true. Expect: "CLEAN-STAGE: wiping..." -> cleanup_run.sh output ->
# model_bcast "Broadcast complete" (NOT "Reusing staged cache") -> CLUSTER READY.
matrix:
  name_template: '{num_nodes}_nodes'
  axes:
  - name: num_nodes
    values:
    - 1
    targets:
    - deployment.num_nodes
    - scheduler.nodes
    label_template: '{value}_nodes'
  derived:
  - path: client.num_nodes
    expr: '1'
trace:
  kind: weak_scaling
workload:
  duration: 5.0
  input_len: 64
  output_len: 64
  rate_per_node: 10.0
  generation_mode: deterministic
deployment:
  models:
  - model_id: meta-llama/Meta-Llama-3-8B-Instruct
    tensor_parallel_size: 1
    pipeline_parallel_size: 1
    max_model_len: 4096
    size: 8
    gpu_memory_utilization: 0.9
    enforce_eager: true
    max_num_seqs: 64
  replica_max_ongoing_requests: 128
client:
  num_runs: 1
  num_nodes: 1
  dest: proxy
  stream: true
  startup_only: true
  num_go_procs: 1
  num_go_workers: 4
backend:
  default: ray
  args:
    ray:
      launch:
        ray_node_cpus: 64
        clean_stage: true
      proxy:
        type: haproxy
        port: 4001
        backend_port: 8000
        num_workers: 1
        options:
          balance: leastconn
          maxconn: 100000
scheduler:
  type: pbs
  queue: debug
  walltime: 01:00:00
