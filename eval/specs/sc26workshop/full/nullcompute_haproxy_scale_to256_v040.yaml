name: nullcompute_haproxy_scale_to256_v040
# Current-infrastructure replacement for the historical 32/64/128/256
# null-compute HAProxy control-plane curve.  startup_only deliberately measures
# canonical deployment bring-up/READY/cleanup rather than token throughput.
# Materialize this spec twice for two independent lifecycle trials per scale;
# client.num_runs does not create a second deployment in startup-only mode.
matrix:
  name_template: 'n{num_nodes}'
  axes:
  - name: num_nodes
    values: [32, 64, 128, 256]
    targets: [deployment.num_nodes, scheduler.nodes]
    label_template: '{value}_nodes'
  derived:
  - path: scheduler.queue
    expr: '"prod" if num_nodes >= 256 else "debug-scaling"'
  - path: scheduler.walltime
    expr: '"03:00:00" if num_nodes >= 256 else "01:00:00"'
trace:
  kind: weak_scaling
workload:
  duration: 10.0
  input_len: 64
  output_len: 64
  rate_per_node: 10.0
  arrival: fixed
  generation_mode: deterministic
deployment:
  validation_mode: true
  num_nodes: 32
  num_gpus_per_node: 12
  models:
  - model_id: meta-llama/Meta-Llama-3-8B-Instruct
    tensor_parallel_size: 1
    pipeline_parallel_size: 1
    max_model_len: 4096
    size: 8
    num_cpus_per_replica: 1
    gpu_memory_utilization: 0.90
    enforce_eager: true
    max_num_seqs: 64
  replica_max_ongoing_requests: 256
client:
  num_runs: 1
  startup_only: true
  dest: proxy
  stream: false
  num_nodes: 1
  num_go_procs: 1
  num_go_workers: 4
backend:
  default: ray
  args:
    ray:
      launch:
        ray_node_cpus: 64
        clean_stage: true
        null_compute: true
        instrumentation: true
      proxy:
        type: haproxy
        port: 4001
        backend_port: 8000
        num_workers: 1
        options:
          balance: leastconn
          maxconn: 8000
scheduler:
  type: pbs
