name: pp405b_pp2_scale_nostream
# NON-STREAM counterpart of pp405b_pp2_scale (HAProxy frontend). Identical
# deployment / workload / staging; the ONLY change is client.stream: false so
# each request returns its full completion in one response instead of an SSE
# token stream. Pairs with pp405b_pp2_scale (stream) so fig7 can show the PP
# weak-scaling line in both delivery modes, mirroring the proxycmp_*_nostream
# split. See pp405b_pp2_scale.yaml for the full rationale of the sweep.
matrix:
  name_template: 'n{num_nodes}'
  axes:
  - name: num_nodes
    values: [4, 8, 16, 32, 64, 128, 256]   # full node sweep for fig7
    targets: [deployment.num_nodes, scheduler.nodes]
    label_template: '{value}_nodes'
  derived:
  # PP=2 -> one replica per 2 nodes. Scale replica count with the cluster.
  - path: deployment.models.0.num_replicas
    expr: 'num_nodes // 2'
  - path: client.num_nodes
    expr: 'min(num_nodes, 4)'
  # 405B bring-up is long (Lustre weights); debug/debug-scaling (1h) is too
  # short, so route small->capacity, large->prod, with walltime scaled up.
  - path: scheduler.queue
    expr: '"capacity" if num_nodes <= 16 else ("prod" if num_nodes >= 256 else "debug-scaling")'
  - path: scheduler.walltime
    expr: '"02:00:00" if num_nodes <= 16 else ("04:00:00" if num_nodes >= 256 else "01:00:00")'
trace:
  kind: weak_scaling
workload:
  duration: 120.0
  input_len: 64
  output_len: 64
  rate_per_node: 0.2          # x num_nodes / (num_nodes/2 replicas) = 0.4 rps/replica
  arrival: fixed              # (~saturation stress; sat_405b_pp2 knee ~0.31 rps/replica)
  generation_mode: deterministic
deployment:
  validation_mode: true
  num_nodes: 4
  # Shard-aware PP (EXASERVE_PP_SHARD_AWARE=1): model_storage_path = Lustre SOURCE
  # (full 405B via flat-form symlink); local_stage_path = NODE-LOCAL tmpfs dest.
  # Global rank 0 streams each PP stage (~380 GiB) only to its recipient ranks,
  # so every node holds its own stage in /tmp and no worker reads Lustre.
  model_storage_path: /lus/flare/projects/AuroraGPT/wenyiw/models
  local_stage_path: /tmp/pp405b_shard
  models:
  - model_id: meta-llama/Llama-3.1-405B-Instruct
    tensor_parallel_size: 8
    pipeline_parallel_size: 2
    num_replicas: 2           # overridden per node count by matrix.derived (num_nodes // 2)
    max_model_len: 4096
    size: 405
    gpu_memory_utilization: 0.90
    enforce_eager: true
    max_num_seqs: 8
  replica_max_ongoing_requests: 16
client:
  num_runs: 6
  dest: proxy
  stream: false               # <-- non-stream: full completion per response (vs SSE stream)
  num_go_procs: 4
  num_go_workers: 4
  go_concurrency: 256
backend:
  default: ray
  args:
    ray:
      launch:
        ray_node_cpus: 64
      proxy:
        type: haproxy
        port: 4001
        backend_port: 8000
        num_workers: 1
        options:
          balance: leastconn
          maxconn: 8000
scheduler:
  type: pbs
