name: pp405b_pp2_scale_direct_nostream
# NON-STREAM counterpart of pp405b_pp2_scale_direct (proxy-bypass baseline).
# Identical to pp405b_pp2_scale_direct except client.stream: false, so it is the
# direct-mode (HAProxy-removed) baseline for the non-stream PP weak-scaling line.
# Together the four PP specs form the 2x2 grid {haproxy, direct} x {stream,
# nostream}. See pp405b_pp2_scale_direct.yaml for the proxy-isolation rationale.
matrix:
  name_template: 'n{num_nodes}'
  axes:
  - name: num_nodes
    values: [4, 8, 16, 32, 64, 128, 256]   # full node sweep for fig7
    targets: [deployment.num_nodes, scheduler.nodes]
    label_template: '{value}_nodes'
  derived:
  # PP=2 -> one replica per 2 nodes. Scale replica count with the cluster.
  - path: deployment.models.0.num_replicas
    expr: 'num_nodes // 2'
  - path: client.num_nodes
    expr: 'min(num_nodes, 4)'
  # Queue reality: capacity <=16 nodes; prod requires >=256 (generous walltime);
  # debug-scaling covers 17-255 but caps at 1h. 405B bring-up is ~36min best-case
  # but can hang/stall at scale (gRPC/health timeouts), so 256 -> prod for the
  # walltime headroom to absorb slow bring-up. 128 has NO good option (prod min
  # 256, debug-scaling 1h) and is the fragile point.
  - path: scheduler.queue
    expr: '"capacity" if num_nodes <= 16 else ("prod" if num_nodes >= 256 else "debug-scaling")'
  - path: scheduler.walltime
    expr: '"02:00:00" if num_nodes <= 16 else ("04:00:00" if num_nodes >= 256 else "01:00:00")'
trace:
  kind: weak_scaling
workload:
  duration: 120.0
  input_len: 64
  output_len: 64
  rate_per_node: 0.2          # x num_nodes / (num_nodes/2 replicas) = 0.4 rps/replica
  arrival: fixed              # (~saturation stress; sat_405b_pp2 knee ~0.31 rps/replica)
  generation_mode: deterministic
deployment:
  num_nodes: 4
  # Shard-aware PP (EXASERVE_PP_SHARD_AWARE=1): model_storage_path = Lustre SOURCE
  # (full 405B via flat-form symlink); local_stage_path = NODE-LOCAL tmpfs dest.
  model_storage_path: /lus/flare/projects/AuroraGPT/wenyiw/models
  local_stage_path: /tmp/pp405b_shard
  models:
  - model_id: meta-llama/Llama-3.1-405B-Instruct
    tensor_parallel_size: 8
    pipeline_parallel_size: 2
    num_replicas: 2           # overridden per node count by matrix.derived (num_nodes // 2)
    max_model_len: 4096
    size: 405
    gpu_memory_utilization: 0.90
    enforce_eager: true
    max_num_seqs: 8
  replica_max_ongoing_requests: 16
client:
  num_runs: 6
  dest: direct                # <-- proxy-bypass: client hits replica stage-0 nodes directly
  direct_dispatch: mesh       # clients distribute over replica routes; targets are not per-node
  stream: false               # <-- non-stream: full completion per response (vs SSE stream)
  num_go_procs: 8             # direct precedent (each rank its own node; no proxy contention)
  num_go_workers: 4
  go_concurrency: 256
backend:
  default: ray
  args:
    ray:
      launch:
        ray_node_cpus: 64
      proxy:
        type: none            # <-- no HAProxy launched at all (removes its head-node health-check load too)
        backend_port: 8000
scheduler:
  type: pbs
