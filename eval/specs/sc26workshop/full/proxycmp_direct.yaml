name: proxycmp_direct
# EXP SET 1 (proxy comparison) — Direct-MPI dispatch (one client per node hits
# its LOCAL Ray Serve port; no shared proxy). Zero-LB upper bound. Mirrors the
# working weakscaling_direct_short_v3 (proxy type none, dest direct) but adds
# stream=true for P99 TTFT/TBT and num_go_procs=8 (each rank owns a node).
# NOTE: validate the 1-node streaming cell first — a prior 1n direct+stream run
# timed out on the per-node HSN health check; confirm before submit-all.
#
# run0 (2026-06) DID NOT actually dispatch node-locally despite the description
# above: the Go client hash-routed every request across all N node URLs, so it
# was an N x N mesh. Fixed 2026-07-25 (client.direct_dispatch, default local);
# run1 onward is genuinely node-local. Measured at n128, mesh vs local makes
# almost no difference (82.6 vs 81.0 QPS/node), so the per-node streaming
# decline with N is NOT cross-node token delivery — see direct_topology.yaml.
matrix:
  name_template: 'n{num_nodes}'
  axes:
  - name: num_nodes
    values: [1, 4, 16, 64]
    targets: [deployment.num_nodes, client.num_nodes, scheduler.nodes]
    label_template: '{value}_nodes'
  derived:
  - path: scheduler.queue
    expr: '"debug" if num_nodes <= 2 else ("capacity" if num_nodes <= 16 else ("prod" if num_nodes >= 256 else "debug-scaling"))'
  - path: scheduler.walltime
    expr: '"01:00:00" if num_nodes <= 2 else ("02:00:00" if num_nodes <= 16 else ("06:00:00" if num_nodes >= 256 else "01:00:00"))'
trace:
  kind: weak_scaling
workload:
  duration: 60.0
  input_len: 64
  output_len: 64
  rate_per_node: 110.0
  arrival: fixed
  generation_mode: deterministic
deployment:
  models:
  - model_id: meta-llama/Meta-Llama-3-8B-Instruct
    tensor_parallel_size: 1
    pipeline_parallel_size: 1
    max_model_len: 4096
    size: 8
    gpu_memory_utilization: 0.90
    enforce_eager: true
    max_num_seqs: 64
  replica_max_ongoing_requests: 256
  collect_stats: true
client:
  # Explicit for the record; local is also the default since 2026-07-25.
  direct_dispatch: local
  num_runs: 6
  dest: direct
  stream: true
  num_go_procs: 8
  num_go_workers: 4
backend:
  default: ray
  args:
    ray:
      launch:
        ray_node_cpus: 64
        clean_stage: true
      proxy:
        type: none
scheduler:
  type: pbs
