name: oat_8b_2kx2k_val
# EXP SET 2 (OAT) - workload perturbation: ShareGPT 2K/2K (2048 in / 2048 out),
# fixed-interval at 90% of its single-node saturation (4 -> 3.6 rps/node).
matrix:
  name_template: 'n{num_nodes}'
  axes:
  - name: num_nodes
    values: [1, 64]
    targets: [deployment.num_nodes, scheduler.nodes]
    label_template: '{value}_nodes'
  derived:
  - path: client.num_nodes
    expr: 'min(num_nodes, 4)'
  - path: scheduler.queue
    expr: '"debug" if num_nodes <= 2 else "debug-scaling"'
  - path: scheduler.walltime
    expr: '"01:00:00"'
trace:
  kind: weak_scaling
workload:
  duration: 60.0
  input_len: 2048
  output_len: 2048
  rate_per_node: 3.6
  arrival: fixed
  generation_mode: deterministic
deployment:
  validation_mode: true
  models:
  - model_id: meta-llama/Meta-Llama-3-8B-Instruct
    tensor_parallel_size: 1
    pipeline_parallel_size: 1
    max_model_len: 8192
    size: 8
    gpu_memory_utilization: 0.90
    enforce_eager: true
    max_num_seqs: 32
  replica_max_ongoing_requests: 128
  collect_stats: true
client:
  num_runs: 2
  dest: proxy
  stream: true
  num_go_procs: 4
  num_go_workers: 4
backend:
  default: ray
  args:
    ray:
      launch:
        ray_node_cpus: 64
        clean_stage: true
      proxy:
        type: haproxy
        port: 4001
        backend_port: 8000
        num_workers: 1
        options:
          balance: leastconn
          maxconn: 8000
scheduler:
  type: pbs
