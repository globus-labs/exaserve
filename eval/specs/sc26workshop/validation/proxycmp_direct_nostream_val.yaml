name: proxycmp_direct_nostream_val
# NON-STREAMING direct control for the non-stream comparison (rate 110, 64/64),
# n64 only. Pairs with proxycmp_haproxy_nostream n64 to show whether non-stream
# proxy E2E recovers toward direct, and with proxycmp_direct_val (streaming) n64
# to test whether streaming backpressure inflated direct's E2E. No TTFT/TBT
# (paper SLO N/A) — judge by E2E latency / throughput / errors. The streaming
# direct n256 (19.4k rps, linear) is the "good" reference for the 256n retest.
matrix:
  name_template: 'n{num_nodes}'
  axes:
  - name: num_nodes
    values: [64]
    targets: [deployment.num_nodes, client.num_nodes, scheduler.nodes]
    label_template: '{value}_nodes'
  derived:
  - path: scheduler.queue
    expr: '"debug-scaling"'
  - path: scheduler.walltime
    expr: '"01:00:00"'
trace:
  kind: weak_scaling
workload:
  duration: 60.0
  input_len: 64
  output_len: 64
  rate_per_node: 110.0
  arrival: fixed
  generation_mode: deterministic
deployment:
  models:
  - model_id: meta-llama/Meta-Llama-3-8B-Instruct
    tensor_parallel_size: 1
    pipeline_parallel_size: 1
    max_model_len: 4096
    size: 8
    gpu_memory_utilization: 0.90
    enforce_eager: true
    max_num_seqs: 64
  replica_max_ongoing_requests: 256
  collect_stats: true
client:
  num_runs: 2
  dest: direct
  stream: false
  num_go_procs: 8
  num_go_workers: 4
backend:
  default: ray
  args:
    ray:
      launch:
        ray_node_cpus: 64
        clean_stage: true
      proxy:
        type: none
scheduler:
  type: pbs
