name: proxycmp_direct_256_val
# EXP SET 1 — 256-node extension (direct dispatch). Pilot (2 runs) of the
# linear-scaling upper bound at 256n. >=256 nodes => prod queue. Identical to
# proxycmp_direct_val except num_nodes=[256] and queue/walltime for prod.
matrix:
  name_template: 'n{num_nodes}'
  axes:
  - name: num_nodes
    values: [256]
    targets: [deployment.num_nodes, client.num_nodes, scheduler.nodes]
    label_template: '{value}_nodes'
  derived:
  - path: scheduler.queue
    expr: '"prod"'
  - path: scheduler.walltime
    expr: '"01:30:00"'
trace:
  kind: weak_scaling
workload:
  duration: 60.0
  input_len: 64
  output_len: 64
  rate_per_node: 110.0
  arrival: fixed
  generation_mode: deterministic
deployment:
  models:
  - model_id: meta-llama/Meta-Llama-3-8B-Instruct
    tensor_parallel_size: 1
    pipeline_parallel_size: 1
    max_model_len: 4096
    size: 8
    gpu_memory_utilization: 0.90
    enforce_eager: true
    max_num_seqs: 64
  replica_max_ongoing_requests: 256
  collect_stats: true
client:
  num_runs: 2
  dest: direct
  stream: true
  num_go_procs: 8
  num_go_workers: 4
backend:
  default: ray
  args:
    ray:
      launch:
        ray_node_cpus: 64
        clean_stage: true
      proxy:
        type: none
scheduler:
  type: pbs
