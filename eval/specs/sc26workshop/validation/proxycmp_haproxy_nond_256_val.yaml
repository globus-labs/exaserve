name: proxycmp_haproxy_nond_256_val
# REGRESSION CONFIRMATION: HAProxy non-stream 256n WITHOUT http-no-delay.
# Identical to proxycmp_haproxy_nostream n256 (rate 110, 64/64, stream=false,
# num_go_procs 4) except options.http_no_delay=false (reverts to the Apr cfg).
# Old (Apr, no http-no-delay): 26.9k rps / 0.04% err / 63s / p99 6.3s.
# Today (Jun, with http-no-delay): 10.9k rps / ~3% err / 154s / p99 146.7s.
# If this recovers toward ~27k, the regression is commit 30e6a30 (global
# http-no-delay). prod queue (>=256n).
matrix:
  name_template: 'n{num_nodes}'
  axes:
  - name: num_nodes
    values: [256]
    targets: [deployment.num_nodes, scheduler.nodes]
    label_template: '{value}_nodes'
  derived:
  - path: client.num_nodes
    expr: 'min(num_nodes, 4)'
  - path: scheduler.queue
    expr: '"prod"'
  - path: scheduler.walltime
    expr: '"01:30:00"'
trace:
  kind: weak_scaling
workload:
  duration: 60.0
  input_len: 64
  output_len: 64
  rate_per_node: 110.0
  arrival: fixed
  generation_mode: deterministic
deployment:
  models:
  - model_id: meta-llama/Meta-Llama-3-8B-Instruct
    tensor_parallel_size: 1
    pipeline_parallel_size: 1
    max_model_len: 4096
    size: 8
    gpu_memory_utilization: 0.90
    enforce_eager: true
    max_num_seqs: 64
  replica_max_ongoing_requests: 256
  collect_stats: true
client:
  num_runs: 2
  dest: proxy
  stream: false
  num_go_procs: 4
  num_go_workers: 4
backend:
  default: ray
  args:
    ray:
      launch:
        ray_node_cpus: 64
        clean_stage: true
      proxy:
        type: haproxy
        port: 4001
        backend_port: 8000
        num_workers: 1
        options:
          balance: leastconn
          maxconn: 8000
          http_no_delay: false
scheduler:
  type: pbs
