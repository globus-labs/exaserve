name: oat_8b_baseline_direct_val
# DISCRIMINATING TEST for the baseline n1->n64 SLO drop.
# Exact twin of oat_8b_baseline_val EXCEPT dest=direct (no centralized HAProxy
# in the request/return path). The proxy baseline already uses a distributed
# MPI client (one rank/node), so HAProxy is the ONLY changed variable here.
#   - If client TTFT/decode at n64 recover toward the n1 values -> the
#     centralized HAProxy SSE return path (http-no-delay token fan-through) is
#     the scale bottleneck.
#   - If they stay inflated -> the effect is server-side, not the proxy.
# Same rate (98 rps/node = 90% single-replica knee), 64/64 tokens, stream=true,
# clean_stage, collect_stats (attempt server-side queued/prefill/decode times).
matrix:
  name_template: 'n{num_nodes}'
  axes:
  - name: num_nodes
    values: [1, 64]
    targets: [deployment.num_nodes, scheduler.nodes]
    label_template: '{value}_nodes'
  derived:
  - path: client.num_nodes
    expr: 'num_nodes'
  - path: scheduler.queue
    expr: '"debug" if num_nodes <= 2 else "debug-scaling"'
  - path: scheduler.walltime
    expr: '"01:00:00"'
trace:
  kind: weak_scaling
workload:
  duration: 60.0
  input_len: 64
  output_len: 64
  rate_per_node: 98.0
  arrival: fixed
  generation_mode: deterministic
deployment:
  models:
  - model_id: meta-llama/Meta-Llama-3-8B-Instruct
    tensor_parallel_size: 1
    pipeline_parallel_size: 1
    max_model_len: 4096
    size: 8
    gpu_memory_utilization: 0.90
    enforce_eager: true
    max_num_seqs: 64
  replica_max_ongoing_requests: 256
  collect_stats: true
client:
  num_runs: 2
  dest: direct
  stream: true
  num_go_procs: 4
  num_go_workers: 4
backend:
  default: ray
  args:
    ray:
      launch:
        ray_node_cpus: 64
        clean_stage: true
      proxy:
        type: none
        backend_port: 8000
scheduler:
  type: pbs
