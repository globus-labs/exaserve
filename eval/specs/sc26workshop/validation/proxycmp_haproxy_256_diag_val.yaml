name: proxycmp_haproxy_256_diag_val
# Re-run canonical 256n streaming (http-no-delay ON, client=4) with the enhanced
# diag (resource-exhaustion capture) to root-cause the HAProxy PROCESS DEATH seen
# in prior 256n runs (warmup served ~10k/99.6%, then proxy died -> data run 100%
# ECONNREFUSED). Watch: fork canary (EAGAIN), thread/fd vs limits, dmesg on death.
matrix:
  name_template: 'n{num_nodes}'
  axes:
  - {name: num_nodes, values: [256], targets: [deployment.num_nodes, scheduler.nodes], label_template: '{value}_nodes'}
  derived:
  - {path: client.num_nodes, expr: 'min(num_nodes, 4)'}
  - {path: scheduler.queue, expr: '"prod"'}
  - {path: scheduler.walltime, expr: '"02:00:00"'}
trace: {kind: weak_scaling}
workload: {duration: 60.0, input_len: 64, output_len: 64, rate_per_node: 110.0, arrival: fixed, generation_mode: deterministic}
deployment:
  models:
  - {model_id: meta-llama/Meta-Llama-3-8B-Instruct, tensor_parallel_size: 1, pipeline_parallel_size: 1, max_model_len: 4096, size: 8, gpu_memory_utilization: 0.90, enforce_eager: true, max_num_seqs: 64}
  replica_max_ongoing_requests: 256
  collect_stats: true
client: {num_runs: 6, dest: proxy, stream: true, num_go_procs: 4, num_go_workers: 4}
backend:
  default: ray
  args:
    ray:
      launch: {ray_node_cpus: 64, clean_stage: true}
      proxy: {type: haproxy, port: 4001, backend_port: 8000, options: {balance: leastconn, maxconn: 8000}}
scheduler: {type: pbs}
