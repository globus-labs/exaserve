name: proxycmp_haproxy_256_nodelayoff_dbgscale_val
# TASK 3: streaming HAProxy 256n with http-no-delay OFF (coalescing on) +
# server-side stats. Hypothesis: coalescing collapses the ~1.8M pkt/s token
# storm into far fewer packets, so the proxy SURVIVES (vs the no-delay-on
# congestion collapse). Client TBT will be bursty (~230ms, INVALID for the SLO)
# but server-side TTFT/TBT (collected) are proxy-immune and ARE valid. client=4
# (correct bounded topology). Compare to:
#   - stream + no-delay ON  (collapsed: ~5k rps / 7M retransmits)
#   - non-stream            (27k rps)
#   - direct stream         (19.4k rps)
matrix:
  name_template: 'n{num_nodes}'
  axes:
  - name: num_nodes
    values: [256]
    targets: [deployment.num_nodes, scheduler.nodes]
    label_template: '{value}_nodes'
  derived:
  - path: client.num_nodes
    expr: 'min(num_nodes, 4)'
  - path: scheduler.queue
    expr: '"debug-scaling"'
  - path: scheduler.walltime
    expr: '"01:00:00"'
trace:
  kind: weak_scaling
workload:
  duration: 60.0
  input_len: 64
  output_len: 64
  rate_per_node: 110.0
  arrival: fixed
  generation_mode: deterministic
deployment:
  models:
  - model_id: meta-llama/Meta-Llama-3-8B-Instruct
    tensor_parallel_size: 1
    pipeline_parallel_size: 1
    max_model_len: 4096
    size: 8
    gpu_memory_utilization: 0.90
    enforce_eager: true
    max_num_seqs: 64
  replica_max_ongoing_requests: 256
  collect_stats: true
client:
  num_runs: 2
  dest: proxy
  stream: true
  num_go_procs: 4
  num_go_workers: 4
backend:
  default: ray
  args:
    ray:
      launch:
        ray_node_cpus: 64
        clean_stage: true
      proxy:
        type: haproxy
        port: 4001
        backend_port: 8000
        num_workers: 1
        options:
          balance: leastconn
          maxconn: 100000
          http_no_delay: false
scheduler:
  type: pbs
