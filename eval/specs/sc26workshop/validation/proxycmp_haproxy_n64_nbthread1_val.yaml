name: proxycmp_haproxy_n64_nbthread1_val
# Control: pin HAProxy to nbthread=1 at n64 streaming (NOT network-collapsed, so the
# thread->CPU->throughput relationship is visible, unlike 256n). Prediction: 1 thread
# saturates ~1 core (CPU <=100%) and throughput drops vs the default-64-thread n64
# (5850 rps). Confirms the ~4 cores HAProxy used were real work (threads matter at the
# low end), even though >4 are idle (I/O-bound). http-no-delay ON (real streaming).
matrix:
  name_template: 'n{num_nodes}'
  axes:
  - name: num_nodes
    values: [64]
    targets: [deployment.num_nodes, scheduler.nodes]
    label_template: '{value}_nodes'
  derived:
  - path: client.num_nodes
    expr: 'min(num_nodes, 4)'
  - path: scheduler.queue
    expr: '"debug-scaling"'
  - path: scheduler.walltime
    expr: '"01:00:00"'
trace:
  kind: weak_scaling
workload:
  duration: 60.0
  input_len: 64
  output_len: 64
  rate_per_node: 110.0
  arrival: fixed
  generation_mode: deterministic
deployment:
  validation_mode: true
  models:
  - model_id: meta-llama/Meta-Llama-3-8B-Instruct
    tensor_parallel_size: 1
    pipeline_parallel_size: 1
    max_model_len: 4096
    size: 8
    gpu_memory_utilization: 0.90
    enforce_eager: true
    max_num_seqs: 64
  replica_max_ongoing_requests: 256
  collect_stats: true
client:
  num_runs: 2
  dest: proxy
  stream: true
  num_go_procs: 4
  num_go_workers: 4
backend:
  default: ray
  args:
    ray:
      launch:
        ray_node_cpus: 64
        clean_stage: true
      proxy:
        type: haproxy
        port: 4001
        backend_port: 8000
        options:
          balance: leastconn
          maxconn: 8000
          nbthread: 1
scheduler:
  type: pbs
