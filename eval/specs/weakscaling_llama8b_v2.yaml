name: weakscaling_llama8b_v2
matrix:
  name_template: "{num_nodes}_nodes"
  axes:
    - name: num_nodes
      values: [1, 2, 4, 8]
      targets: [deployment.num_nodes, client.num_nodes, scheduler.nodes]
      label_template: "{value}_nodes"
trace:
  kind: weak_scaling
workload:
  duration: 60.0
  input_len: 2048
  output_len: 128
  # Burst test: 1 node saturates at 231 rps (12 replicas, go_concurrency=192)
  # 231 × 0.7 headroom = 162 rps/node
  rate_per_node: 162.0
  generation_mode: deterministic
deployment:
  models:
    - model_id: meta-llama/Meta-Llama-3-8B-Instruct
      tensor_parallel_size: 1
      pipeline_parallel_size: 1
      max_model_len: 4096
      size: 8
      gpu_memory_utilization: 0.90
      enforce_eager: true
      max_num_seqs: 32
  replica_max_ongoing_requests: 64
client:
  num_runs: 1
  dest: proxy
  stream: true
  # Burst test: need go_concurrency >= 192 to saturate vLLM batch scheduler
  # At 162 rps with ~1s avg latency: concurrency ≈ 162, fits in 1 proc
  num_go_procs: 1
  go_concurrency: 192
  num_go_workers: 4
backend:
  default: ray
  args:
    ray:
      launch:
        ray_node_cpus: 64
      proxy:
        type: litellm
        num_workers: 2
scheduler:
  type: pbs
