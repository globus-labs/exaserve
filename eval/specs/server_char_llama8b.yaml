backend:
  args:
    ray:
      launch:
        ray_node_cpus: 64
      proxy:
        num_workers: 2
        type: litellm
  default: ray
client:
  dest: direct
  num_go_procs: 1
  num_go_workers: 4
  saturation:
    enabled: true
    initial_rate: 50
    search_mode: binary
    step_duration_s: 15
    stream: true
    tolerance: 0.05
    warmup_duration_s: 5
deployment:
  models:
  - enforce_eager: true
    gpu_memory_utilization: 0.9
    max_model_len: 4096
    model_id: meta-llama/Meta-Llama-3-8B-Instruct
    pipeline_parallel_size: 1
    size: 8
    tensor_parallel_size: 1
  num_nodes: 1
  replica_max_ongoing_requests: 128
matrix:
  axes:
  - label_template: mns{value}
    name: max_num_seqs
    targets:
    - deployment.models.0.max_num_seqs
    values:
    - 64
  name_template: mns{max_num_seqs}
name: server_char_llama8b
scheduler:
  queue: debug
  type: pbs
  walltime: 01:00:00
trace:
  kind: weak_scaling
workload:
  duration: 5.0
  input_len: 2048
  output_len: 128
  rate_per_node: 1000.0
