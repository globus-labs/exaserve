name: server_char_llama8b
matrix:
  name_template: "mor{max_ongoing}"
  axes:
    - name: max_ongoing
      values: [64, 96, 128, 256, 512]
      targets: [deployment.replica_max_ongoing_requests]
      label_template: "mor{value}"
trace:
  kind: weak_scaling
workload:
  duration: 5.0
  input_len: 2048
  output_len: 128
  rate_per_node: 1000.0
deployment:
  num_nodes: 1
  collect_stats: true
  models:
    - model_id: meta-llama/Meta-Llama-3-8B-Instruct
      tensor_parallel_size: 1
      pipeline_parallel_size: 1
      max_model_len: 4096
      size: 8
      gpu_memory_utilization: 0.90
      enforce_eager: true
      max_num_seqs: 64
client:
  saturation:
    enabled: true
    search_mode: binary
    initial_rate: 50
    step_duration_s: 15
    warmup_duration_s: 5
    tolerance: 0.05
    stream: true
  num_go_procs: 1
  go_concurrency: 1024
  num_go_workers: 4
  dest: direct
backend:
  default: ray
  args:
    ray:
      launch:
        ray_node_cpus: 64
      proxy:
        type: litellm
        num_workers: 2
scheduler:
  type: pbs
  queue: debug
  walltime: "01:00:00"
