name: longctx_sat_4096
# Saturation finder for input_len=4096 at 1n. Sweep rate_per_node finely
# to find where TTFT starts climbing — the "knee" of the latency curve.
# Prior data:
#   rate=4  rps/N: TTFT p99 = 1.05 s (sustained, headroom)
#   rate=16 rps/N: TTFT p99 = 4.91 s (overloaded)
# So the knee is between 4 and 16. Sweep {4,6,8,10,12,14} = 6 points.
# All on debug queue (1 node, ~10 min each, serial 1+1 limit).
matrix:
  name_template: 'rps{rate_per_node}'
  axes:
  - name: rate_per_node
    values: [4, 6, 8, 10, 12, 14]
    targets: [workload.rate_per_node]
    label_template: 'rps{value}'
  derived:
  - path: client.num_nodes
    expr: '1'
  - path: scheduler.queue
    expr: '"debug"'
  - path: scheduler.walltime
    expr: '"01:00:00"'
trace:
  kind: weak_scaling
workload:
  duration: 60.0
  input_len: 4096
  output_len: 64
  rate_per_node: 4
  generation_mode: deterministic
deployment:
  num_nodes: 1
  models:
  - model_id: meta-llama/Meta-Llama-3-8B-Instruct
    tensor_parallel_size: 1
    pipeline_parallel_size: 1
    max_model_len: 8192
    size: 8
    gpu_memory_utilization: 0.90
    enforce_eager: true
    max_num_seqs: 32
  replica_max_ongoing_requests: 128
client:
  num_runs: 2
  dest: proxy
  stream: true
  num_go_procs: 4
  num_go_workers: 4
backend:
  default: ray
  args:
    ray:
      launch:
        ray_node_cpus: 64
      proxy:
        type: haproxy
        port: 4001
        backend_port: 8000
        num_workers: 1
        options:
          balance: leastconn
          maxconn: 100000
scheduler:
  type: pbs
