name: slo_curve_v1
# Experiment B: goodput-vs-offered-load curves per cluster size.
# Sweeps rate_per_node from under-saturation to over-saturation, with
# streaming on so the goodput.py post-processor can compute TTFT/TPOT SLOs.
#
# To adjust budget: trim num_nodes values or rate_per_node values.
# Total variants = len(num_nodes) * len(rate_per_node) = 4 * 7 = 28.
matrix:
  name_template: '{num_nodes}_nodes_rps{rate_per_node}'
  axes:
  - name: num_nodes
    values: [1, 8, 32, 64]
    targets: [deployment.num_nodes, scheduler.nodes]
    label_template: '{value}_nodes'
  - name: rate_per_node
    values: [30, 60, 90, 110, 130, 150, 180]
    targets: [workload.rate_per_node]
    label_template: 'rps{value}'
  derived:
  - path: client.num_nodes
    expr: 'num_nodes'
trace:
  kind: weak_scaling
workload:
  duration: 60.0
  input_len: 64
  output_len: 64
  rate_per_node: 110.0   # overridden by matrix
  generation_mode: deterministic
deployment:
  models:
  - model_id: meta-llama/Meta-Llama-3-8B-Instruct
    tensor_parallel_size: 1
    pipeline_parallel_size: 1
    max_model_len: 4096
    size: 8
    gpu_memory_utilization: 0.90
    enforce_eager: true
    max_num_seqs: 64
  replica_max_ongoing_requests: 256
client:
  num_runs: 4
  dest: proxy
  stream: true
  num_go_procs: 4
  num_go_workers: 4
backend:
  default: ray
  args:
    ray:
      launch:
        ray_node_cpus: 64
      proxy:
        type: haproxy
        port: 4001
        backend_port: 8000
        num_workers: 1
        options:
          balance: leastconn
          maxconn: 100000
scheduler:
  type: pbs
