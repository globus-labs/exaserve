name: server_char_llama8b_short_v2
matrix:
  name_template: mns{max_num_seqs}_mor{replica_max_ongoing_requests}
  axes:
    - name: max_num_seqs
      values: [64, 256]
      targets: [deployment.models.0.max_num_seqs]
      label_template: "mns{value}"
    - name: replica_max_ongoing_requests
      values: [64, 256]
      targets: [deployment.replica_max_ongoing_requests]
      label_template: "mor{value}"
trace:
  kind: weak_scaling
workload:
  duration: 5.0
  input_len: 64
  output_len: 64
  rate_per_node: 1000.0
deployment:
  num_nodes: 1
  models:
    - model_id: meta-llama/Meta-Llama-3-8B-Instruct
      tensor_parallel_size: 1
      pipeline_parallel_size: 1
      max_model_len: 4096
      size: 8
      gpu_memory_utilization: 0.90
      enforce_eager: true
  replica_max_ongoing_requests: 128
client:
  dest: direct
  num_go_procs: 1
  num_go_workers: 4
  saturation:
    enabled: true
    initial_rate: 100
    search_mode: binary
    step_duration_s: 15
    stream: true
    tolerance: 0.05
    warmup_duration_s: 5
    plateau_ratio: 0.75
backend:
  default: ray
  args:
    ray:
      launch:
        ray_node_cpus: 64
      proxy:
        type: none
scheduler:
  type: pbs
  queue: debug
  walltime: 01:00:00
