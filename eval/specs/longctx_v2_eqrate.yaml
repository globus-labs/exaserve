name: longctx_v2_eqrate
# Long-context, FAIR comparison #1: equal absolute offered rate (4 rps/N)
# for both input_len=64 and input_len=4096. Both regimes are lightly loaded
# so queue depth doesn't dominate TTFT. Resulting TTFT should reflect
# prefill cost only:
#   - input=64:    expect TTFT ~50-100 ms (decode-bound)
#   - input=4096:  expect TTFT ~1-1.5 s (prefill-bound)
matrix:
  name_template: 'n{num_nodes}_in{input_len}'
  axes:
  - name: num_nodes
    values: [1, 16, 64]
    targets: [deployment.num_nodes, scheduler.nodes]
    label_template: '{value}_nodes'
  - name: input_len
    values: [64, 4096]
    targets: [workload.input_len]
    label_template: 'in{value}'
  derived:
  - path: client.num_nodes
    expr: 'num_nodes'
  - path: scheduler.queue
    expr: '"debug" if num_nodes <= 2 else "debug-scaling"'
  - path: scheduler.walltime
    expr: '"01:00:00"'
trace:
  kind: weak_scaling
workload:
  duration: 60.0
  input_len: 64
  output_len: 64
  rate_per_node: 4.0
  generation_mode: deterministic
deployment:
  models:
  - model_id: meta-llama/Meta-Llama-3-8B-Instruct
    tensor_parallel_size: 1
    pipeline_parallel_size: 1
    max_model_len: 8192
    size: 8
    gpu_memory_utilization: 0.90
    enforce_eager: true
    max_num_seqs: 32
  replica_max_ongoing_requests: 128
client:
  num_runs: 2
  dest: proxy
  stream: true
  num_go_procs: 4
  num_go_workers: 4
backend:
  default: ray
  args:
    ray:
      launch:
        ray_node_cpus: 64
      proxy:
        type: haproxy
        port: 4001
        backend_port: 8000
        num_workers: 1
        options:
          balance: leastconn
          maxconn: 100000
scheduler:
  type: pbs
