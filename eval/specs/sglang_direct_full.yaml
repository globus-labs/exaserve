name: sglang_direct_full
# SGLang backend, Direct-MPI dispatch weak scaling n1..n128 — completes the
# direct series begun by sglang_direct_n256 (n256 banked in its run4 with the
# GCS-bootstrap hardening). Identical paper protocol to sglang_haproxy_full
# run8 (Meta-Llama-3-8B-Instruct, seqs64/ongoing256, rate 15 = 0.9*S); only
# the dispatch path differs (client rank per node -> local Serve port, no
# proxy). Client mirrors proxycmp_direct (num_go_procs=8, one rank per node).
# NOTE (from proxycmp_direct): a prior 1n direct+stream run timed out on the
# per-node HSN health check — validate n1 before submit-all.
matrix:
  name_template: 'n{num_nodes}'
  axes:
  - name: num_nodes
    values: [1, 4, 16, 64, 128]
    targets: [deployment.num_nodes, client.num_nodes, scheduler.nodes]
    label_template: '{value}_nodes'
  derived:
  - path: scheduler.queue
    expr: '"capacity" if num_nodes <= 16 else "debug-scaling"'
  - path: scheduler.walltime
    expr: '"02:00:00" if num_nodes <= 16 else "01:00:00"'
trace:
  kind: weak_scaling
workload:
  duration: 60.0
  input_len: 64
  output_len: 64
  rate_per_node: 15.0
  arrival: fixed
  generation_mode: deterministic
deployment:
  engine: sglang
  models:
  - model_id: meta-llama/Meta-Llama-3-8B-Instruct
    tensor_parallel_size: 1
    pipeline_parallel_size: 1
    max_model_len: 4096
    size: 8
    gpu_memory_utilization: 0.90
    enforce_eager: true
    max_num_seqs: 64
  replica_max_ongoing_requests: 256
  collect_stats: false
client:
  num_runs: 6
  dest: direct
  stream: true
  num_go_procs: 8
  num_go_workers: 4
backend:
  default: ray
  args:
    ray:
      launch:
        ray_node_cpus: 64
        clean_stage: true
      proxy:
        type: none
scheduler:
  type: pbs
