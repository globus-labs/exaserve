name: longctx_v1
# Experiment F: long-context sweep. Stresses prefill (quadratic in input_len)
# vs decode (linear). max_model_len=8192 stays within Llama-3-8B's native
# context. For true 32K/64K context, swap in a long-context model.
#
# rate_per_node scales DOWN with input_len because prefill compute grows
# quadratically. Uses combine=zip so num_nodes runs in cartesian with the
# zipped (input_len, rate_per_node) pairs.
#
# Variants: 2 (num_nodes) x 4 (paired input/rate) = 8.
matrix:
  name_template: 'n{num_nodes}_in{input_len}'
  combine: cartesian
  axes:
  - name: num_nodes
    values: [8, 32]
    targets: [deployment.num_nodes, scheduler.nodes]
    label_template: '{value}_nodes'
  - name: input_len
    values: [64, 1024, 4096, 7680]
    targets: [workload.input_len]
    label_template: 'in{value}'
  derived:
  - path: client.num_nodes
    expr: '{num_nodes}'
  # rate_per_node ramps down quadratically with input_len. Reference points:
  # in=64 -> 110, in=1024 -> 40, in=4096 -> 10, in=7680 -> 4.
  # Approximate with: max(4, 110 * (64/input_len)**0.85)
  - path: workload.rate_per_node
    expr: 'max(4.0, 110.0 * (64.0 / input_len) ** 0.85)'
trace:
  kind: weak_scaling
workload:
  duration: 60.0
  input_len: 64       # overridden by matrix
  output_len: 64
  rate_per_node: 110  # overridden by derived
  generation_mode: deterministic
deployment:
  models:
  - model_id: meta-llama/Meta-Llama-3-8B-Instruct
    tensor_parallel_size: 1
    pipeline_parallel_size: 1
    max_model_len: 8192
    size: 8
    gpu_memory_utilization: 0.90
    enforce_eager: true
    max_num_seqs: 32
  replica_max_ongoing_requests: 128
client:
  num_runs: 4
  dest: proxy
  stream: true
  num_go_procs: 4
  num_go_workers: 4
backend:
  default: ray
  args:
    ray:
      launch:
        ray_node_cpus: 64
      proxy:
        type: haproxy
        port: 4001
        backend_port: 8000
        num_workers: 1
        options:
          balance: leastconn
          maxconn: 100000
scheduler:
  type: pbs
