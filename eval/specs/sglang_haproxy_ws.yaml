name: sglang_haproxy_ws
# SGLang weak-scaling via Ray Serve (SGLangWorker embeds sgl.Engine) + HAProxy + Go
# replay client. SGLang is encoded in the spec, but the default Aurora release
# SiteProfile rejects it until a separately qualified SGLang profile is supplied.
# so launch_cluster/driver/server select the SGLang engine on the frameworks-inheriting
# venv. Apples-to-apples vs the vLLM weak-scaling: same control plane / proxy / client.
matrix:
  name_template: '{num_nodes}_nodes'
  axes:
  - name: num_nodes
    values:
    - 1
    - 2
    - 4
    - 8
    - 16
    targets:
    - deployment.num_nodes
    - scheduler.nodes
    label_template: '{value}_nodes'
  derived:
  - path: client.num_nodes
    expr: 'min(num_nodes, 4)'
trace:
  kind: weak_scaling
workload:
  duration: 60.0
  input_len: 512
  output_len: 128
  rate_per_node: 10.0
  generation_mode: deterministic
deployment:
  engine: sglang            # drop-in backend select: vllm (default) | sglang
  model_storage_path: /lus/flare/projects/datasets/model-weights
  models:
  - model_id: meta-llama/Llama-3.1-8B-Instruct
    tensor_parallel_size: 1
    pipeline_parallel_size: 1
    max_model_len: 4096
    size: 8
    gpu_memory_utilization: 0.85
    enforce_eager: true
    max_num_seqs: 32
  replica_max_ongoing_requests: 128
client:
  num_runs: 2
  num_nodes: 1
  dest: proxy
  stream: false
  num_go_procs: 1
  num_go_workers: 4
  go_concurrency: 200
backend:
  default: ray
  args:
    ray:
      launch:
        ray_node_cpus: 64
      proxy:
        type: haproxy
        port: 4001
        backend_port: 8000
        num_workers: 1
        options:
          balance: leastconn
          maxconn: 8000
scheduler:
  type: pbs
  queue: capacity
  walltime: 02:00:00
