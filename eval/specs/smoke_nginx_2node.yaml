name: smoke_nginx_2node
# Smokes the MPI-only distribute + gather path on >1 node.
# Identical to smoke_nginx_1node except num_nodes=2 so bcast/gather have
# real workers (not just rank 0).
matrix:
  name_template: '{num_nodes}_nodes'
  axes:
  - name: num_nodes
    values:
    - 2
    targets:
    - deployment.num_nodes
    - scheduler.nodes
    label_template: '{value}_nodes'
  derived:
  - path: client.num_nodes
    expr: '1'
trace:
  kind: weak_scaling
workload:
  duration: 30.0
  input_len: 2048
  output_len: 128
  rate_per_node: 5.0
  generation_mode: deterministic
deployment:
  models:
  - model_id: meta-llama/Meta-Llama-3-8B-Instruct
    tensor_parallel_size: 1
    pipeline_parallel_size: 1
    max_model_len: 4096
    size: 8
    gpu_memory_utilization: 0.9
    enforce_eager: true
    max_num_seqs: 64
  replica_max_ongoing_requests: 128
client:
  num_runs: 1
  num_nodes: 1
  dest: proxy
  stream: false
  num_go_procs: 1
  num_go_workers: 4
  go_concurrency: 200
backend:
  default: ray
  args:
    ray:
      launch:
        ray_node_cpus: 64
      proxy:
        type: nginx
        port: 4001
        backend_port: 8000
        options:
          lb_method: least_conn
          worker_connections: 50000
scheduler:
  type: pbs
  queue: capacity
  walltime: 01:00:00
