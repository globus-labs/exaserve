name: pp2_verify_2node
# Verify multi-replica PP auto-calc END-TO-END: Llama-3-8B, TP=1, PP=2, on 2
# nodes, num_replicas INTENTIONALLY UNSET. Expectation: the planner auto-packs
# multiple PP replicas (each spanning 2 distinct nodes) AND they serve requests.
# Confirms the paper's "multi-node model" row can weak-scale without setting
# num_replicas, and that multi-replica PP works at runtime (vLLM bundle indices).
matrix:
  name_template: '{num_nodes}_nodes'
  axes:
  - name: num_nodes
    values:
    - 2
    targets:
    - deployment.num_nodes
    - scheduler.nodes
    label_template: '{value}_nodes'
  derived:
  - path: client.num_nodes
    expr: '2'
trace:
  kind: weak_scaling
workload:
  duration: 30.0
  input_len: 128
  output_len: 64
  rate_per_node: 5.0
  generation_mode: deterministic
deployment:
  # Fresh stage path so both lease nodes start "missing" and bcast uniformly
  # (avoids the mixed-cache refusal from reusing a 1-node-warmed lease).
  local_stage_path: /tmp/hf_home_pp2verify
  models:
  - model_id: meta-llama/Meta-Llama-3-8B-Instruct
    tensor_parallel_size: 1
    pipeline_parallel_size: 2
    max_model_len: 4096
    size: 8
    gpu_memory_utilization: 0.9
    enforce_eager: true
    max_num_seqs: 64
  replica_max_ongoing_requests: 128
client:
  num_runs: 1
  num_nodes: 2
  dest: proxy
  stream: true
  num_go_procs: 2
  num_go_workers: 4
  go_concurrency: 200
backend:
  default: ray
  args:
    ray:
      launch:
        ray_node_cpus: 64
      proxy:
        type: haproxy
        port: 4001
        backend_port: 8000
        num_workers: 1
        options:
          balance: leastconn
          maxconn: 100000
scheduler:
  type: pbs
  queue: debug
  walltime: 01:00:00
