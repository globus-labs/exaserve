# Fully commented weak-scaling example for the eval control plane.
#
# This file is meant to be a reference for every supported spec knob plus the
# Ray backend knobs currently consumed by eval/lib/backends/ray.py.
# It lives under eval/specs/ so it can be validated either by name or by path:
#   python -m eval.cli spec validate example_weakscaling_full
#   python -m eval.cli spec validate eval/specs/example_weakscaling_full.yaml
#
# The active values below validate as-is on Aurora. Site-specific path overrides
# are shown as commented lines where using the shared site_config defaults is
# usually safer.

name: weak_scaling_litellm_full_example

# Matrix expansion turns one declarative spec into a set of materialized runs.
# Here we sweep node count and keep deployment/client/scheduler in lock-step.
matrix:
  # Controls the human-readable variant name before slugification.
  name_template: "{num_nodes}_nodes"
  axes:
    - name: num_nodes
      # One run bundle will be created for each value in this list.
      values: [1, 2, 4, 8]
      # Each target is a dotted field path on the ExperimentSpec dataclass.
      targets:
        - deployment.num_nodes
        - client.num_nodes
        - scheduler.nodes
      # Used if you omit name_template and want axis-local labels.
      label_template: "{value}_nodes"

trace:
  # Supported values today: "weak_scaling" and "azure_trace".
  kind: weak_scaling
  # Optional. If omitted, site_config.input_prompt_path is used.
  # input_prompt_path: /absolute/path/to/ShareGPT_V3_unfiltered_cleaned_split_no_imsorry.json
  # Optional. Only used by azure_trace; ignored for weak_scaling.
  # input_trace_path: /absolute/path/to/AzureLLMInferenceTrace_code_1week.csv

workload:
  # Required wall-clock duration in seconds for trace generation / replay.
  duration: 5.0
  # Prompt token budget used by weak_scaling and as a fallback for azure_trace.
  input_len: 2048
  # Requested generation length in tokens.
  output_len: 128
  # Requests per second per deployment node.
  rate_per_node: 80.0
  # For azure_trace only: divide trace time by this factor to accelerate replay.
  speedup: 1.0
  # For azure_trace only: current code expects values such as "peak" or "sparse".
  sampling_strategy: peak
  # Passed through to the replay client; "deterministic" is the usual default.
  generation_mode: deterministic
  # Seed used for prompt sampling / trace generation.
  seed: 42
  # Relative weights for request mode assignment in the replay client.
  modes:
    chat: 1
    completion: 0

deployment:
  # Base value when the matrix does not overwrite deployment.num_nodes.
  num_nodes: 1
  # Optional. If omitted, site_config.model_storage_path is used.
  # model_storage_path: /lus/flare/projects/AuroraGPT/<user>/models
  # Optional. If omitted, site_config.local_stage_path is used.
  # local_stage_path: /tmp/hf_home
  # This maps directly to Ray Serve's `max_ongoing_requests` for each replica.
  # It is wired through the runtime manifest and applied in src/exaserve_serve.py.
  replica_max_ongoing_requests: 64
  # Defaults from site_config.num_gpus_per_node if omitted.
  num_gpus_per_node: 12
  models:
    - model_id: meta-llama/Meta-Llama-3-8B-Instruct
      # Tensor-parallel workers per replica.
      tensor_parallel_size: 1
      # Context length limit exposed to the trace generator and engine config.
      max_model_len: 4096
      # Approximate model size in billions of parameters; used by some trace logic.
      size: 8
      # Pipeline-parallel stage count.
      pipeline_parallel_size: 1
      # Optional fixed replica count. Omit or set null for backend-managed default.
      num_replicas: null
      # CPU reservation per replica actor.
      num_cpus_per_replica: 4
      # Forwarded into the serving engine config.
      gpu_memory_utilization: 0.90
      # Forwarded into the serving engine config.
      enforce_eager: true
      # Forwarded into the serving engine config.
      enable_log_requests: true

client:
  # Number of replay repetitions; results are written as result0.json, result1.json, ...
  num_runs: 1
  # Include TP metadata in the replay output.
  include_tp: false
  # Fractional early-stop threshold in [0, 1]; 0 disables early stopping.
  early_stop: 0.0
  # "proxy" hits the optional proxy layer; "direct" hash-shards requests across
  # the per-node Ray Serve HTTP endpoints.
  dest: proxy
  # Base value when the matrix does not overwrite client.num_nodes.
  num_nodes: 1
  # Go processes per client node.
  num_go_procs: 16
  # Dispatch goroutines per Go process.
  num_go_workers: 2
  # Maximum in-flight requests per Go process.
  go_concurrency: 40
  # Optional warmup request rate before the measured run.
  warmup_rps: 0
  # Optional warmup duration in seconds.
  warmup_duration_s: 0.0
  # If true, only the summary is written instead of per-request detail.
  sum_only: false

backend:
  # Supported backends today: "ray" and "mock".
  default: ray
  args:
    # mock is useful for dry-runs and unit tests.
    # mock: {}
    ray:
      launch:
        # Override the env script used inside the PBS job if needed.
        # env_script: /home/<user>/script/env_aurora
        # Sets EXASERVE_NULL_COMPUTE=1 for the launcher / serving stack.
        null_compute: false
        # Ray head port written into the runtime manifest.
        ray_head_port: 6379
        # CPU count reported per Ray node in the runtime manifest.
        ray_node_cpus: 64
      proxy:
        # "litellm", "haproxy", or "none".
        type: litellm
        # Proxy listen port on the head node.
        port: 4001
        # Backend Ray Serve HTTP port on each node.
        backend_port: 8000
        # Optional. If omitted, site_config.litellm_python_path is used.
        # python_path: /home/<user>/agpt/venv/litellm/bin/python3
        # Worker count for the proxy implementation.
        num_workers: 2
        # Passed verbatim to the proxy backend.
        #
        # LiteLLM-specific option keys currently consumed by src/proxy/litellm_proxy.py:
        #   master_key: "sk-..."
        #   routing_strategy: "least-busy" | "simple-shuffle" | "latency-based-routing"
        #   num_retries: 2
        #   timeout: 300
        #   db_url: ""
        #   extra_router: {}
        #   extra_general: {}
        #
        # HAProxy-specific option keys currently consumed by src/proxy/haproxy_proxy.py:
        #   balance: "leastconn" | "roundrobin" | "random"
        #   check_interval: 5000
        #   check_fall: 3
        #   check_rise: 2
        #   stats_port: 9999
        #   maxconn: 50000
        options: {}

scheduler:
  # Only PBS is currently supported by the Ray backend.
  type: pbs
  # Base value when the matrix does not overwrite scheduler.nodes.
  nodes: 1
  # Optional. If omitted, eval chooses a queue from node count.
  queue: debug
  # Optional. If omitted, eval chooses a default walltime from node count.
  walltime: "01:00:00"
  project: AuroraGPT
  filesystems: home:flare
  keep_output: doe
  # Optional. If omitted, site_config.pbs_mail_user is used.
  mail_user: ""
  # PBS mail flags such as b/a/e; default in code is "bae".
  mail_events: bae
