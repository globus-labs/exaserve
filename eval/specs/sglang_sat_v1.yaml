name: sglang_sat_v1
# Single-node saturation finder for the SGLang backend (post JIT-storm fixes),
# aligned with the sc26workshop paper baseline (proxycmp_haproxy / oat_8b_*):
# Meta-Llama-3-8B-Instruct, gpu_mem 0.90, replica_max_ongoing 256. Feeds the
# OAT protocol: measured saturation S -> weak-scaling runs at 0.9*S
# (vLLM: 109 -> 98 rps/node in oat_8b_baseline).
#
# Aggressive rate steps (geometric ~1.35x, top = 2.7x the ~13 rps ceiling seen
# in run3) so the finder overshoots the knee rather than converging low.
# Two engine configs at every rate:
#   seqs32 = the config that produced the clean run7 sglang weak-scaling sweep
#   seqs64 = paper vLLM-baseline parity — if this also behaves, the earlier
#            collapse was the JIT storm, not the knobs; if not, keep seqs32
#            and note the deviation in the paper.
# abortonclose so client-aborted overload requests are cancelled in the engine
# (via SGLangWorker's abort propagation) instead of decoding as zombies, which
# would deflate the measured ceiling.
matrix:
  name_template: 'rps{rate_per_node}_seqs{max_num_seqs}'
  axes:
  - name: rate_per_node
    values: [10, 14, 19, 26, 35]
    targets: [workload.rate_per_node]
    label_template: 'rps{value}'
  - name: max_num_seqs
    values: [32, 64]
    targets: [deployment.models.0.max_num_seqs]
    label_template: 'seqs{value}'
trace:
  kind: weak_scaling
workload:
  duration: 60.0
  input_len: 64
  output_len: 64
  rate_per_node: 10.0
  arrival: fixed
  generation_mode: deterministic
deployment:
  engine: sglang
  num_nodes: 1
  # model_storage_path deliberately omitted: Meta-Llama-3-8B-Instruct lives in
  # the site-default storage (like the paper specs), not datasets/model-weights.
  models:
  - model_id: meta-llama/Meta-Llama-3-8B-Instruct
    tensor_parallel_size: 1
    pipeline_parallel_size: 1
    max_model_len: 4096
    size: 8
    gpu_memory_utilization: 0.90
    enforce_eager: true
    max_num_seqs: 32
  replica_max_ongoing_requests: 256
  collect_stats: false
client:
  num_runs: 2
  num_nodes: 1
  dest: proxy
  stream: true
  num_go_procs: 4
  num_go_workers: 4
backend:
  default: ray
  args:
    ray:
      launch:
        ray_node_cpus: 64
        clean_stage: true
      proxy:
        type: haproxy
        port: 4001
        backend_port: 8000
        num_workers: 1
        options:
          balance: leastconn
          maxconn: 8000
          abortonclose: true
scheduler:
  type: pbs
  nodes: 1
  queue: capacity
  walltime: 00:45:00
