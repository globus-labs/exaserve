# Sample config. Copy and adjust paths or generate configs via eval/exp_generator.py.
job_replay_client_config:
  config_path: config.yaml
  dest: proxy
  early_stop: 0.0
  generation_mode: deterministic
  include_tp: false
  num_nodes: 1
  num_runs: 1
  num_go_procs: 1
  num_go_workers: 4
  go_concurrency: 2000
  warmup_rps: 0
  warmup_duration_s: 0.0
  sum_only: false
job_seed: 42
job_trace_config:
  duration: 300.0
  input_prompt_path: /path/to/data/input_traces/ShareGPT_V3_unfiltered_cleaned_split_no_imsorry.json
  input_trace_path: /path/to/data/input_traces/AzureLLMInferenceTrace_code_1week.csv
  modes:
    chat: 1
    completion: 0
  output_len: 128
  output_trace_path: /path/to/data/output_traces/sample_sparse_300s_300x.jsonl
  sampling_strategy: sparse
  speedup: 300.0
model_deployment_config:
  deployment_name: exaserve_serve
  model_configs:
  - enable_log_requests: true
    enforce_eager: true
    gpu_memory_utilization: 0.9
    max_model_len: 4096
    model_id: meta-llama/Meta-Llama-3-8B-Instruct
    num_cpus_per_replica: 4
    num_replicas: null
    pipeline_parallel_size: 1
    size: 8
    tensor_parallel_size: 1
  local_stage_path: /tmp/hf_home
  model_storage_path: /path/to/models
  num_gpus_per_node: 12
  num_nodes: 2
  replica_max_ongoing_requests: 32
pbs_job_name: sample_sparse
pbs_num_nodes: 2
pbs_queue_name: debug
pbs_result_dir: /path/to/data/results/sample_sparse
pbs_stderr_dir: /path/to/data/pbs_output/sample_sparse/stderr
pbs_stdout_dir: /path/to/data/pbs_output/sample_sparse/stdout
pbs_walltime: 00:30:00
pbs_working_dir: .
proxy_config:
  backend_port: 8000
  python_path: /path/to/litellm/bin/python3
  options: {}
  port: 4001
  type: litellm
