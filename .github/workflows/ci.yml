name: CI

# PR-031 / WP11: hermetic release-gating checks. These jobs run the portable
# core (schema/state/scheduler/planner/proxy-config/control-channel tests)
# from a clean checkout. XPU/Ray-overlay/engine behavior and real MPI/scale
# runs are NOT covered here — those are the Aurora WP12 lanes.

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  portable-lock:
    name: portable uv lock (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install the pinned lock tool
        run: python -m pip install uv==0.10.1
      - name: Check the lock without updating it
        run: uv lock --check --no-build --no-python-downloads
      - name: Sync only portable development and test groups
        run: uv sync --locked --group dev --group test --no-python-downloads
      - name: Verify portable pins and absence of the GPU stack
        run: |
          uv run --no-sync python - <<'PY'
          from importlib import metadata, util
          from pathlib import Path
          from packaging.requirements import Requirement

          for line in Path("requirements/ci.lock").read_text().splitlines():
              line = line.strip()
              if not line or line.startswith("#"):
                  continue
              requirement = Requirement(line)
              if requirement.marker is not None and not requirement.marker.evaluate():
                  continue
              observed = metadata.version(requirement.name)
              if observed not in requirement.specifier:
                  raise SystemExit(f"portable pin drift: {requirement}, installed {observed}")
          present = [name for name in ("ray", "vllm", "torch") if util.find_spec(name)]
          if present:
              raise SystemExit(f"portable uv environment contains the GPU stack: {present}")
          print("portable pins match ci.lock; ray/vllm/torch are absent")
          PY

  go-client:
    name: Go replay client tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: "1.23.9"
      - name: Check Go formatting
        working-directory: eval/go_client
        run: test -z "$(gofmt -l .)"
      - name: Vet the production replay binary
        working-directory: eval/go_client
        run: go vet ./...
      - name: Test the production replay binary
        working-directory: eval/go_client
        run: go test ./...

  test:
    name: hermetic tests (py${{ matrix.python }}, ${{ matrix.order }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]
        order: [fixed]
        include:
          # A second, randomized-order job on one interpreter that prints a
          # replayable seed (WP11 item 10).
          - python: "3.12"
            order: random
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install (core + dev, no GPU stack)
        run: |
          python -m pip install pip==26.2.1
          pip install -r requirements/ci.lock
          pip install --no-deps -e .
      - name: Assert no undeclared host tools are needed
        run: |
          # AC-TST-01: the suite must not require ripgrep or other host bins.
          if command -v rg >/dev/null 2>&1; then echo "note: rg present"; fi
      - name: Assert the heavy stack really is absent
        run: |
          # This lane's whole value is that Ray/vLLM are missing. If a future
          # dependency change pulls them in, the "hermetic" claim is silently
          # false and Aurora-only breakage stops being caught here.
          python - <<'PY'
          import importlib.util, sys
          present = [m for m in ("ray", "vllm", "torch") if importlib.util.find_spec(m)]
          if present:
              sys.exit(f"hermetic lane is not hermetic: {present} installed")
          print("hermetic: ray/vllm/torch absent as expected")
          PY
      - name: Run hermetic suite (fixed order)
        if: matrix.order == 'fixed'
        env:
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: >-
          python -m pytest -q -p no:randomly -p pytest_cov
          --cov=exaserve --cov=eval --cov=clientlab
          --cov-report=term-missing --cov-report=xml
      - name: Run hermetic suite (randomized order, replayable seed)
        if: matrix.order == 'random'
        env:
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: python -m pytest -q -o addopts="" -p randomly -v
      - name: Save portable coverage report
        if: always() && matrix.order == 'fixed'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-py${{ matrix.python }}
          path: coverage.xml
          if-no-files-found: warn
          retention-days: 14

  packaged:
    name: packaged wheel test (not an editable checkout)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Build the wheel
        run: |
          python -m pip install pip==26.2.1
          pip install -r requirements/ci.lock
          # The wheel is built from a freshly extracted sdist and its package
          # members must exactly match src/ plus declared package data. A plain
          # `python -m build` builds the wheel first and can reuse stale
          # build/lib files from a long-lived checkout.
          python scripts/hardening/build_release_artifacts.py --output-dir dist
      - name: Install the WHEEL and run the suite against it
        run: |
          # IMP-H07: CI previously tested an editable checkout, so a file that
          # was never packaged still passed. Installing the wheel into a clean
          # venv and running the suite against the INSTALLED package is what
          # proves the artifact a user would get actually works.
          python -m venv /tmp/pkg
          /tmp/pkg/bin/pip install pip==26.2.1
          /tmp/pkg/bin/pip install -r requirements/ci.lock
          /tmp/pkg/bin/pip install --no-deps dist/*.whl
          # Use a dedicated empty cwd. A shared /tmp can contain unrelated
          # namespace-package directories (for example /tmp/ray), which makes
          # importorskip() believe optional stacks are installed.
          mkdir -p /tmp/pkg-run
          cd /tmp/pkg-run   # never import from the source tree
          EXASERVE_TEST_INSTALLED_WHEEL=1 PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 \
            HF_HUB_OFFLINE=1 TRANSFORMERS_OFFLINE=1 \
            /tmp/pkg/bin/python -m pytest -q -p no:randomly "$GITHUB_WORKSPACE"
      - name: Assert the packaged resources shipped
        run: |
          /tmp/pkg/bin/python -c "
          from importlib import resources
          root = resources.files('exaserve') / 'resources'
          for name in ('bcast.c', 'bcast.Makefile'):
              assert (root / name).is_file(), f'{name} missing from the wheel'
          assert not (root / 'launch_cluster.sh').is_file(), 'retired shell adapter shipped'
          import exaserve.launcher
          print('packaged resources OK')"

  ledger:
    name: findings ledger validator
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: python -m pip install pip==26.2.1 && pip install -r requirements/ci.lock
      - name: Validate every record against plan section 8
        run: python scripts/hardening/validate_findings.py

  lint:
    name: format + lint + type + security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: python -m pip install pip==26.2.1 && pip install -r requirements/ci.lock
      - name: Ruff format (release-gating)
        run: ruff format --check .
      - name: Ruff (correctness-critical rules — release-gating)
        run: ruff check .
      - name: Ruff (production/runtime lint — release-gating)
        run: ruff check --select E4,E7,F src/exaserve eval/lib eval/cli.py clientlab tests conftest.py
      - name: High-confidence security static checks
        run: ruff check --select S102,S307,S602,S608,S609 src/exaserve eval/lib clientlab
      - name: Typed contract core
        run: >-
          mypy --ignore-missing-imports --follow-imports=skip
          src/exaserve/plan/contracts.py src/exaserve/control/contracts.py
          src/exaserve/telemetry.py src/exaserve/state/results.py
