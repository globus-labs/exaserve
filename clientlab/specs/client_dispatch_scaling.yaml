# How does dispatch throughput scale with the number of Go processes?
#
# Design:
#   - service_time=0 (echo server)
#   - rate=1000000 per process — rate limiter never the bottleneck
#   - max_active_requests=80 (shown not to matter in dispatch_ceiling)
#   - Sweep num_go_procs from 1 to 16
#   - duration=10s for stable measurement
#
# How to read results:
#   If scaling is linear, achieved_rps should grow proportionally with num_go_procs.
#   A plateau reveals shared-resource contention (kernel, NIC, server, memory bus).

study:
  name: client-dispatch-scaling
  suite: client_dispatch_scaling
  repeats: 1
matrix:
  axes:
    - name: num_go_procs
      path: client.num_go_procs
      values: [1, 2, 4, 8, 12, 16]
client:
  duration_s: 10.0
  rate: 1000000.0
  prompt_words: 32
  output_tokens: 16
  num_go_workers: 4
  num_go_procs: 1
  max_active_requests: 80
  queue_capacity: 0
  max_conns_per_host: 0
  enable_httptrace: true
  phase_trace_sample_rate: 0.01
target:
  type: synthetic
  mode: dispatch_ceiling
  synthetic_nodes: 1
  host: 127.0.0.1
  port: 18500
faults:
  service_time:
    distribution: fixed
    value_ms: 0.0
collectors:
  port_monitor: true
  netstats: false
  target_metrics: true
execution:
  mode: local
