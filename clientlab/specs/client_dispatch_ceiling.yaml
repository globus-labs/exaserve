# Find the maximum req/s a single Go process can dispatch with zero server delay.
#
# Design:
#   - service_time=0 makes the C++ server an echo server (respond instantly)
#   - rate=1000000 (1M) ensures the rate limiter is never the bottleneck —
#     the Go client's dispatch loop is always the ceiling
#   - Sweep max_active_requests to see how throughput scales with concurrency
#   - num_go_procs=1, single process measurement
#
# How to read results:
#   achieved_rps is the raw dispatch ceiling for that concurrency level.
#   The plateau is the max req/s one Go process can achieve.

study:
  name: client-dispatch-ceiling
  suite: client_dispatch_ceiling
  repeats: 1
matrix:
  axes:
    - name: max_active_requests
      path: client.max_active_requests
      values: [40, 80, 160, 320, 640, 1280, 2560, 5120, 10240]
client:
  duration_s: 5.0
  rate: 1000000.0
  prompt_words: 32
  output_tokens: 16
  num_go_workers: 4
  num_go_procs: 1
  max_active_requests: 40
  queue_capacity: 0
  max_conns_per_host: 0
  enable_httptrace: true
  phase_trace_sample_rate: 0.05
target:
  type: synthetic
  mode: dispatch_ceiling
  synthetic_nodes: 1
  host: 127.0.0.1
  port: 18500
faults:
  service_time:
    distribution: fixed
    value_ms: 0.0
collectors:
  port_monitor: true
  netstats: false
  target_metrics: true
execution:
  mode: local
