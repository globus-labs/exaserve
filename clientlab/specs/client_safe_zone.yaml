# Client per-process safe zone characterization.
#
# Goal: find the max concurrency a single Go process can sustain before
# scheduling overhead degrades throughput. Results parameterize weak scaling
# experiments so the client is never the bottleneck.
#
# Design:
#   - 2D sweep: max_active_requests x service_time
#   - RPS is set to 100000 so the concurrency window is always saturated,
#     even at high concurrency with zero delay. For service_time > 0, excess
#     requests queue in the client semaphore (desired behavior to observe).
#     For service_time = 0, this stress-tests the raw dispatch loop ceiling.
#   - C++ server thread pool auto-sizes to match client concurrency.
#   - No capacity limits on server (max_inflight=0) — server is never the bottleneck.
#
# How to validate server isn't the bottleneck:
#   Check target_metrics.target_queue_peak in results. Should be 0 or 1.
#
# How to read results:
#   For each (concurrency, service_time) pair, expected throughput = C / T.
#   If achieved < expected, the gap is client overhead.
#   The largest concurrency where achieved ≈ expected is the safe zone boundary.

study:
  name: client-safe-zone
  suite: client_safe_zone
  repeats: 1
matrix:
  axes:
    - name: max_active_requests
      path: client.max_active_requests
      values: [2048, 8192]
    - name: service_time_ms
      path: faults.service_time.value_ms
      values: [0, 100, 1000, 2000]
client:
  duration_s: 5.0
  rate: 10000.0
  prompt_words: 32
  output_tokens: 16
  num_go_workers: 4
  num_go_procs: 1
  max_active_requests: 64
  queue_capacity: 0
  max_conns_per_host: 0
  enable_httptrace: true
  phase_trace_sample_rate: 0.05
target:
  type: synthetic
  mode: safe_zone
  synthetic_nodes: 1
  host: 127.0.0.1
  port: 18500
faults:
  service_time:
    distribution: fixed
    value_ms: 0.0
collectors:
  port_monitor: true
  netstats: false
  target_metrics: true
execution:
  mode: local
