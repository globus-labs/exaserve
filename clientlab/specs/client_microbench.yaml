study:
  name: client-microbench
  suite: client_microbench
  repeats: 1
matrix:
  axes:
    - name: max_active_requests
      path: client.max_active_requests
      values: [8, 16, 32]
client:
  duration_s: 2.0
  rate: 50.0
  prompt_words: 32
  output_tokens: 16
  num_go_workers: 2
  num_go_procs: 1
  max_active_requests: 16
  queue_capacity: 0
  max_conns_per_host: 0
  enable_httptrace: true
  phase_trace_sample_rate: 0.1
target:
  type: synthetic
  mode: echo_fast
  synthetic_nodes: 1
  host: 127.0.0.1
  port: 18100
faults:
  service_time:
    distribution: fixed
    value_ms: 0.0
collectors:
  port_monitor: true
  netstats: false
execution:
  mode: local
