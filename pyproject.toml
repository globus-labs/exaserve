[build-system]
requires = ["setuptools==78.1.1", "wheel==0.46.3"]
build-backend = "setuptools.build_meta"

[project]
name = "exaserve"
dynamic = ["version"]
description = "Ray Serve helpers and scale patches for LLM inference on HPC clusters (reference platform: ALCF Aurora)"
requires-python = ">=3.10"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{name = "Wenyi Wang", email = "wenyiw@uchicago.edu"}]
maintainers = [{name = "Wenyi Wang", email = "wenyiw@uchicago.edu"}]
keywords = ["hpc", "llm", "inference", "ray-serve", "distributed-systems", "modcon"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "PyYAML>=6",
    "packaging>=23",
]

[project.urls]
Repository = "https://github.com/globus-labs/exaserve"
Documentation = "https://github.com/globus-labs/exaserve/tree/main/docs"
"Issue Tracker" = "https://github.com/globus-labs/exaserve/issues"
Changelog = "https://github.com/globus-labs/exaserve/blob/main/CHANGELOG.md"

[project.optional-dependencies]
server = [
    "fastapi>=0.100",
    # The generated overlay and private-API capability profile are exact-byte
    # qualified against this stack. A broader dependency range would install
    # versions that ExaServe intentionally rejects before launch.
    "ray[serve]==2.53.0",
    "vllm==0.15.0",
]
proxy = [
    "litellm",
]
# PSI/J is an explicitly selected scheduler capability. The Aurora release
# default is native PBS; native pbs/slurm need no extra Python dependency.
scheduler = [
    "psij-python>=0.9",
]
dev = [
    "build>=1",
    "pytest>=8",
    # IMP-H07: the randomized-order CI job needs this plugin present on a
    # clean runner; `pytest -p randomly` fails without it.
    "pytest-randomly>=3",
]
eval = [
    "numpy>=2.0",
    "matplotlib>=3.9",
    "ijson>=3.4",
]
paper = [
    "datasets>=4.5,<5",
    "ijson>=3.4",
    "transformers==4.57.6",
]

# Portable development only. Explicit transitive pins preserve the existing
# requirements/ci.lock environment; runtime/site stacks are not installed here.
[dependency-groups]
dev = [
    "pip==26.2.1",
    "uv==0.10.1",
    "build==1.4.0",
    "pyproject-hooks==1.2.0",
    "setuptools==78.1.1",
    "wheel==0.46.3",
    "ruff==0.11.6",
    "mypy==1.17.1",
    "mypy_extensions==1.1.0",
    "pathspec==0.12.1",
    "typing_extensions==4.15.0",
]
test = [
    "PyYAML==6.0.3",
    "packaging==25.0",
    "pytest==8.3.5",
    "pytest-randomly==4.0.1",
    "pytest-cov==7.1.0",
    "coverage==7.14.0",
    "iniconfig==2.3.0",
    "pluggy==1.6.0",
    "Pygments==2.19.2",
    "exceptiongroup==1.3.1",
    "tomli==2.4.1",
    "numpy==2.2.6",
    "matplotlib==3.10.7",
    "ijson==3.4.0.post0",
    "contourpy==1.3.2",
    "cycler==0.12.1",
    "fonttools==4.60.1",
    "kiwisolver==1.4.9",
    "pillow==11.3.0",
    "pyparsing==3.2.5",
    "python-dateutil==2.9.0.post0",
    "six==1.17.0",
]

[tool.uv]
required-version = "==0.10.1"
default-groups = ["dev", "test"]
# This is the reproducible development lock's envelope, not a new hardware
# support claim. vLLM 0.15.0's optional published extra requires Python <3.14.
# Published core requires-python and all server/runtime pins remain unchanged.
environments = ["sys_platform == 'linux' and python_version < '3.14'"]

[tool.coverage.run]
branch = true
source = ["exaserve", "eval", "clientlab"]
relative_files = true
omit = ["*/tests/*", "eval/testing.py"]

[tool.coverage.report]
show_missing = true
skip_empty = true
# Establish a measured portable baseline before proposing a gating threshold.
# Coverage does not qualify GPU, native MPI, scheduler, or scale behavior.

[tool.coverage.xml]
output = "coverage.xml"

[tool.coverage.html]
directory = "htmlcov"

[project.scripts]
exaserve-launch-cluster = "exaserve.cli:launch_cluster"
exaserve-driver         = "exaserve.cli:driver"
exaserve-model-bcast    = "exaserve.cli:model_bcast"
exaserve-ray-start      = "exaserve.cli:ray_start"
exaserve-serve-submit   = "exaserve.cli:serve_submit"
exaserve-serve-url      = "exaserve.cli:serve_url"
exaserve-status         = "exaserve.cli:status"

[tool.setuptools]
include-package-data = true

[tool.setuptools.dynamic]
version = {attr = "exaserve._version.__version__"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["exaserve*"]
namespaces = true

[tool.setuptools.package-data]
"exaserve" = ["py.typed"]
"exaserve.resources" = ["*.c", "*.Makefile", "vllm_modelinfo/*.json"]

[tool.pytest.ini_options]
# WP0 canonical test policy (doc/hardening/BASELINE.md): deterministic order
# by default; the WP11 randomized CI job re-enables ordering explicitly with
# `-o addopts=""` and records the printed pytest-randomly seed.
addopts = "-p no:randomly"
testpaths = ["tests", "eval/tests", "clientlab/tests"]
# The installed-wheel gate passes the repository root explicitly, so testpaths
# alone cannot prevent recursion into an operator-created nested checkout.
norecursedirs = [".git", "artifacts", "build", "dist", "tmp"]

[tool.ruff]
# Lint the first-party surfaces. The generated compatibility bootstrap is
# governed by its exact source hash and excluded from mechanical style churn.
target-version = "py310"
line-length = 100
extend-exclude = [
    "src/exaserve/_sitecustomize.py",
]

[tool.ruff.lint]
# The default is the correctness-critical whole-tree floor. CI additionally
# applies E4/E7/F to production/runtime surfaces and a high-confidence security
# subset, plus `ruff format --check` across all first-party Python.
select = ["E9", "F63", "F7", "F82", "F811"]
ignore = []

[tool.ruff.lint.per-file-ignores]
# Compatibility activation must run before importing Ray/Serve.
"src/exaserve/server.py" = ["E402"]
