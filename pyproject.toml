[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aurora-rayserver"
version = "0.1.0"
description = "Ray Serve helpers and scale patches for Aurora HPC vLLM deployments"
requires-python = ">=3.10"
readme = "README.md"
dependencies = [
    "PyYAML>=6",
    "packaging>=23",
]

[project.scripts]
# aurora-launch-cluster is added in commit 3 once the launcher moves into
# resources/. For now console scripts cover the Python entry points only.
aurora-driver       = "aurora_rayserver.cli:driver"
aurora-server       = "aurora_rayserver.cli:server"
aurora-model-bcast  = "aurora_rayserver.cli:model_bcast"
aurora-ray-start    = "aurora_rayserver.cli:ray_start"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
include = ["aurora_rayserver*"]
namespaces = false

[tool.setuptools.package-data]
"aurora_rayserver" = ["py.typed"]
"aurora_rayserver.patches" = ["ray_serve_overlay/ray/serve/_private/*.py"]
# Note: scripts/launch_cluster.sh stays at the repo root (snapshot path)
# for now since the eval pipeline invokes it from there. v0.1.0 wheel users
# get the Python API; the launcher gets packaged into resources/ in a
# follow-up commit (commit 3 of the production_packaging plan).
