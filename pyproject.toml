[build-system]
requires = ["setuptools==78.1.1", "wheel==0.46.3"]
build-backend = "setuptools.build_meta"

[project]
name = "exaserve"
dynamic = ["version"]
description = "Ray Serve helpers and scale patches for LLM inference on HPC clusters (reference platform: ALCF Aurora)"
requires-python = ">=3.10"
readme = "README.md"
dependencies = [
    "PyYAML>=6",
    "packaging>=23",
]

[project.optional-dependencies]
server = [
    "fastapi>=0.100",
    # The generated overlay and private-API capability profile are exact-byte
    # qualified against this stack. A broader dependency range would install
    # versions that ExaServe intentionally rejects before launch.
    "ray[serve]==2.53.0",
    "vllm==0.15.0",
]
proxy = [
    "litellm",
]
# PSI/J is an explicitly selected scheduler capability. The Aurora release
# default is native PBS; native pbs/slurm need no extra Python dependency.
scheduler = [
    "psij-python>=0.9",
]
dev = [
    "build>=1",
    "pytest>=8",
    # IMP-H07: the randomized-order CI job needs this plugin present on a
    # clean runner; `pytest -p randomly` fails without it.
    "pytest-randomly>=3",
]
eval = [
    "numpy>=2.0",
    "matplotlib>=3.9",
    "ijson>=3.4",
]
paper = [
    "datasets>=4.5,<5",
    "ijson>=3.4",
    "transformers==4.57.6",
]

[project.scripts]
exaserve-launch-cluster = "exaserve.cli:launch_cluster"
exaserve-driver         = "exaserve.cli:driver"
exaserve-model-bcast    = "exaserve.cli:model_bcast"
exaserve-ray-start      = "exaserve.cli:ray_start"
exaserve-serve-submit   = "exaserve.cli:serve_submit"
exaserve-serve-url      = "exaserve.cli:serve_url"
exaserve-status         = "exaserve.cli:status"

[tool.setuptools]
include-package-data = true

[tool.setuptools.dynamic]
version = {attr = "exaserve._version.__version__"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["exaserve*"]
namespaces = true

[tool.setuptools.package-data]
"exaserve" = ["py.typed"]
"exaserve.resources" = ["*.c", "*.Makefile"]

[tool.pytest.ini_options]
# WP0 canonical test policy (doc/hardening/BASELINE.md): deterministic order
# by default; the WP11 randomized CI job re-enables ordering explicitly with
# `-o addopts=""` and records the printed pytest-randomly seed.
addopts = "-p no:randomly"
testpaths = ["tests", "eval/tests", "clientlab/tests"]
# The installed-wheel gate passes the repository root explicitly, so testpaths
# alone cannot prevent recursion into an operator-created nested checkout.
norecursedirs = [".git", "artifacts", "build", "dist", "tmp"]

[tool.ruff]
# Lint the first-party surfaces. The generated compatibility bootstrap is
# governed by its exact source hash and excluded from mechanical style churn.
target-version = "py310"
line-length = 100
extend-exclude = [
    "src/exaserve/_sitecustomize.py",
]

[tool.ruff.lint]
# The default is the correctness-critical whole-tree floor. CI additionally
# applies E4/E7/F to production/runtime surfaces and a high-confidence security
# subset, plus `ruff format --check` across all first-party Python.
select = ["E9", "F63", "F7", "F82", "F811"]
ignore = []

[tool.ruff.lint.per-file-ignores]
# Compatibility activation must run before importing Ray/Serve.
"src/exaserve/server.py" = ["E402"]
