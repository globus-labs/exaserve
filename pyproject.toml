[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "exaserve"
version = "0.2.0"
description = "Ray Serve helpers and scale patches for LLM inference on HPC clusters (reference platform: ALCF Aurora)"
requires-python = ">=3.10"
readme = "README.md"
dependencies = [
    "PyYAML>=6",
    "packaging>=23",
]

[project.optional-dependencies]
server = [
    "fastapi>=0.100",
    "ray[serve]>=2.49",
    "vllm",
]
proxy = [
    "litellm",
]
dev = [
    "build>=1",
    "pytest>=8",
]

[project.scripts]
exaserve-launch-cluster = "exaserve.cli:launch_cluster"
exaserve-driver         = "exaserve.cli:driver"
exaserve-server         = "exaserve.cli:server"
exaserve-model-bcast    = "exaserve.cli:model_bcast"
exaserve-ray-start      = "exaserve.cli:ray_start"
exaserve-serve-submit   = "exaserve.cli:serve_submit"
exaserve-serve-url      = "exaserve.cli:serve_url"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
include = ["exaserve*"]
namespaces = true

[tool.setuptools.package-data]
"exaserve" = ["py.typed"]
"exaserve.patches" = ["ray_serve_overlay/ray/serve/_private/*.py"]
"exaserve.resources" = ["*.sh", "*.c", "*.Makefile"]
