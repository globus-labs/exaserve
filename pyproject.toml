[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "exaserve"
version = "0.3.0"
description = "Ray Serve helpers and scale patches for LLM inference on HPC clusters (reference platform: ALCF Aurora)"
requires-python = ">=3.10"
readme = "README.md"
dependencies = [
    "PyYAML>=6",
    "packaging>=23",
]

[project.optional-dependencies]
server = [
    "fastapi>=0.100",
    "ray[serve]>=2.49",
    "vllm",
]
proxy = [
    "litellm",
]
# PR-027: PSI/J is the DEFAULT submit backend; declare it so the advertised
# default is self-contained. Native pbs/slurm need no extra dependency.
scheduler = [
    "psij-python>=0.9",
]
dev = [
    "build>=1",
    "pytest>=8",
]

[project.scripts]
exaserve-launch-cluster = "exaserve.cli:launch_cluster"
exaserve-driver         = "exaserve.cli:driver"
exaserve-server         = "exaserve.cli:server"
exaserve-model-bcast    = "exaserve.cli:model_bcast"
exaserve-ray-start      = "exaserve.cli:ray_start"
exaserve-serve-submit   = "exaserve.cli:serve_submit"
exaserve-serve-url      = "exaserve.cli:serve_url"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
include = ["exaserve*"]
namespaces = true

[tool.setuptools.package-data]
"exaserve" = ["py.typed"]
"exaserve.patches" = ["ray_serve_overlay/ray/serve/_private/*.py"]
"exaserve.resources" = ["*.sh", "*.c", "*.Makefile"]

[tool.pytest.ini_options]
# WP0 canonical test policy (doc/hardening/BASELINE.md): deterministic order
# by default; the WP11 randomized CI job re-enables ordering explicitly with
# `-o addopts=""` and records the printed pytest-randomly seed.
addopts = "-p no:randomly"

[tool.ruff]
# PR-031: lint the first-party surfaces. The vendored Ray Serve overlay and
# the large monkeypatch module are excluded — they intentionally mirror
# upstream and are governed by the WP3 compatibility manifest, not style.
target-version = "py310"
line-length = 100
extend-exclude = [
    "src/exaserve/patches/ray_serve_overlay",
    "src/exaserve/_sitecustomize.py",
]

[tool.ruff.lint]
# PR-031: the release-gating subset is correctness-critical only — syntax
# errors (E9), undefined names / bad comparisons / f-string bugs (F63/F7/F82),
# and redefinitions (F811). This is already clean across the whole tree and
# catches real bugs. The broader style/unused-import cleanup (full "F", "E4",
# "E7") is tracked as an incremental follow-up and is NOT release-gating yet.
select = ["E9", "F63", "F7", "F82", "F811"]
ignore = []
