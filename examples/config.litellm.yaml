# --- LiteLLM-fronted deployment ------------------------------------------
# A LiteLLM proxy runs on the head node and exposes an OpenAI-compatible
# API with API-key auth, rate limiting, usage tracking, and model-aware
# routing. Clients hit http://<head>:4001/v1/... with Authorization.
#
# Requires a separate litellm venv because LiteLLM pins different
# dependency versions than Ray/vLLM. See scripts/setup_litellm_venv.sh.
#
# Run with:
#   qsub -v CONFIG=examples/config.litellm.yaml examples/launch.pbs

ray_cluster_config:
  head_ip: ""
  port: 6379
  node_cpus: 64

model_deployment_config:
  num_nodes: 1
  model_storage_path: /lus/flare/projects/AuroraGPT/wenyiw/models # ! Change to your own model path
  local_stage_path: /tmp/hf_home
  deployment_name: aurora_serve
  replica_max_ongoing_requests: 32
  num_gpus_per_node: 12

  model_configs:
    - model_id: meta-llama/Meta-Llama-3-8B-Instruct
      tensor_parallel_size: 1
      pipeline_parallel_size: 1
      max_model_len: 4096
      size: 8
      gpu_memory_utilization: 0.90
      enforce_eager: true
      max_num_seqs: 64

proxy_config:
  type: litellm
  port: 4001
  backend_port: 8000

  # Absolute path to the python in your litellm venv. The launcher derives
  # the `litellm` console script from this (<dir>/litellm).
  python_path: /home/wenyiw/venv/litellm/bin/python3

  # uvicorn worker count. Keep at 1 on Aurora.
  # Higher values fork more children, and individual children frequently
  # die during startup (uvicorn re-spawns them, which is self-healing but
  # stretches cluster ready-time by minutes per retry). A single worker
  # is plenty for the typical proxy throughput requirement here; raise
  # only after measuring a real throughput ceiling and accepting the
  # longer startup.
  num_workers: 1
  options:
    master_key: "sk-aurora"     # bearer token required from callers
    routing_strategy: least-busy # least-busy | simple-shuffle | latency-based-routing
    num_retries: 2
    timeout: 300
