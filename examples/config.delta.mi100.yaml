# --- NCSA Delta, AMD MI100 (ROCm) — EXAMPLE, validate on the node ------------
# Delta's AMD partition `gpuMI100x8` is a SINGLE node (hostname gpud01) with
# 8× MI100 (gfx908, 32 GB) + 1× MI210. This config serves Llama-3-8B one replica
# per MI100 (8 replicas, one node). Multi-node AMD is not available on Delta.
#
# Deploy (Slurm + ROCm — set these in your env, NOT in the YAML):
#   export EXASERVE_SCHEDULER=slurm
#   export EXASERVE_VENDOR=rocm
#   export EXASERVE_ENV_SETUP='module load gcc python
#   export PATH=/opt/rocm/bin:$PATH
#   source $WORK/exaserve-venv/bin/activate'   # a venv with ROCm torch+vLLM
#   exaserve-serve-submit examples/config.delta.mi100.yaml \
#       --project-account <your-gpu-account> --queue gpuMI100x8 --wait
#
# Or interactively:
#   salloc -A <acct> --partition=gpuMI100x8-interactive --nodes=1 \
#          --gpus-per-node=8 --time=01:00:00
#   EXASERVE_VENDOR=rocm exaserve-launch-cluster examples/config.delta.mi100.yaml
#
# UNVERIFIED until run on gpud01: exact ROCm version, whether ROCR_VISIBLE_DEVICES
# vs HIP_VISIBLE_DEVICES is the right isolation var (override with
# EXASERVE_ROCM_VISIBLE_VAR=HIP_VISIBLE_DEVICES if needed), and whether haproxy is
# on PATH (build via scripts/build_haproxy.sh, or use proxy_config.type: none).

ray_cluster_config:
  head_ip: ""
  port: 6379
  node_cpus: 128            # dual EPYC 7763 = 128 cores on the MI100 node

model_deployment_config:
  num_nodes: 1
  model_storage_path: /work/hdd/<ALLOC>/<USER>/models  # ! Delta scratch (/work/hdd)
  local_stage_path: /tmp                                # node-local SSD (~1.5 TB)
  deployment_name: exaserve_serve
  replica_max_ongoing_requests: 128
  num_gpus_per_node: 8     # 8× MI100 (the 9th MI210 is left out for homogeneity)

  model_configs:
    - model_id: meta-llama/Meta-Llama-3-8B-Instruct
      tensor_parallel_size: 1
      pipeline_parallel_size: 1
      max_model_len: 4096
      size: 8
      gpu_memory_utilization: 0.90
      enforce_eager: true
      max_num_seqs: 64

proxy_config:
  type: haproxy            # haproxy | litellm | none  (build haproxy first, or use 'none')
  port: 4001
  backend_port: 8000
  num_workers: 1
  options:
    balance: leastconn
    maxconn: 50000
