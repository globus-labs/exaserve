# Canonical ExaServe deployment input. Scheduler selection/allocation fields
# belong to exaserve-serve-submit or the eval RunPlan, not this document.

num_nodes: 1
num_gpus_per_node: 12
node_cpus: 64
ray_port: 6379
model_storage_path: /lus/flare/projects/YOUR_PROJECT/YOUR_USER/models
local_stage_path: /tmp/hf_home
deployment_name: exaserve_serve
replica_max_ongoing_requests: 32
collect_stats: false
engine: vllm
vendor: xpu

models:
  - model_id: meta-llama/Meta-Llama-3-8B-Instruct
    tensor_parallel_size: 1
    pipeline_parallel_size: 1
    max_model_len: 4096
    size: 8
    gpu_memory_utilization: 0.90
    enforce_eager: true
    enable_log_requests: true
    max_num_seqs: 64
    num_replicas: 1
    num_cpus_per_replica: 4

exposure:
  mode: PROXIED_INTERNAL
  advertised_scheme: http
  advertised_path: /v1
  network_boundary: trusted_allocation
  request_body_limit_bytes: 16777216

gateway:
  kind: haproxy
  port: 4001
  backend_port: 8000
  executable_ref: PATH:haproxy
  worker_count: 1
  options:
    balance: leastconn
    check_interval: 5000
    check_fall: 3
    check_rise: 2
    stats_port: 9999
    maxconn: 8000

runtime:
  null_compute: false
  null_compute_latency_s: 1.0
  instrumentation: false
  pp_shard_aware: false
  clean_stage: false
