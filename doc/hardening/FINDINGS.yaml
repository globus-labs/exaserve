- id: REL-STAT-01
  source: 2026-08-30 release consolidation audit
  severity: high
  invariant: READY lease validity uses monotonic time and cannot be changed by wall-clock adjustment or reboot ambiguity
  primary_work_package: WP5
  affected_regions:
  - src/exaserve/status_api.py
  acceptance_tests:
  - AC-RDY-01
  - AC-STAT-01
  status: FIXED
  decision: READY persists a monotonic deadline and Linux boot identity; same-boot readers compare monotonic time, boot mismatch fails closed, and wall expiry is evidence only.
  evidence:
  - tests/test_status_api.py
  - src/exaserve/status_api.py
  fallback: Treat READY as expired whenever the monotonic clock identity is unavailable or mismatched.
  residual_risk: The selected implementation relies on Linux boot_id, which is part of the declared Aurora release platform.
  support_impact: NTP or manual wall-clock changes cannot extend or prematurely revoke READY.
  owner: codex
  approval: null
  revisit_condition: Status persistence crosses a non-Linux platform or clock domain.
- id: REL-SCHED-01
  source: 2026-08-30 release consolidation audit
  severity: medium
  invariant: Batch submission never selects one scheduler backend for a run group containing multiple scheduler types
  primary_work_package: WP8
  affected_regions:
  - eval/lib/run_executor.py
  acceptance_tests:
  - AC-TST-01
  status: FIXED
  decision: The PBS release submit-all path scans every immutable run plan and rejects mixed scheduler groups before reconciliation, scheduler lookup, or submission.
  evidence:
  - eval/tests/test_eval_control_plane.py
  - eval/lib/run_executor.py
  fallback: Split runs into scheduler-homogeneous groups; native mixed-site orchestration remains deferred.
  residual_risk: Genuine cross-scheduler group orchestration remains unimplemented until an offsite Slurm profile is qualified.
  support_impact: A mixed group cannot silently send Slurm rows through PBS or vice versa.
  owner: codex
  approval: null
  revisit_condition: Mixed-site orchestration enters a declared support envelope.
